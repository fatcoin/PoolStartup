<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Poolie Start-Ups</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<style>
  :root {
    /* "Pool Water" theme, shared with the Commercial Pools tracker */
    --bg: #0e1520; --bg-deep: #0a111a; --surface: rgba(24,37,56,.50);
    --surface-raised: rgba(32,48,70,.58); --surface-pressed: rgba(14,24,38,.60); --surface-solid: #16243a;
    --border: rgba(255,255,255,.13); --border-strong: rgba(0,180,216,.30);
    --text: #eef7fb; --text-muted: #a9bccb; --text-faint: #6f7b8d;
    --accent: #00b4d8; --accent-bright: #48cae4; --accent-hover: #0096c7; --accent-pressed: #0077b6; --accent-glow: rgba(0,180,216,.35);
    --brand: #1676b7; --brand-orange: #f39a2b;
    --danger: #ef476f; --warn: #ffb703; --success: #06d6a0;
    --radius: 12px; --radius-sm: 8px; --radius-lg: 18px;
    --neu-out: inset 0 1px 0 rgba(255,255,255,.13), 0 12px 38px rgba(0,0,0,.38);
    --neu-out-sm: inset 0 1px 0 rgba(255,255,255,.10), 0 6px 18px rgba(0,0,0,.30);
    --neu-in: inset 0 1px 3px rgba(0,0,0,.34); --neu-in-sm: inset 0 1px 2px rgba(0,0,0,.28);
    --ease: cubic-bezier(0.4,0,0.2,1);
    --top-h: 58px;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent-bright); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .muted { color: var(--text-muted); } .faint { color: var(--text-faint); }
  .num { font-variant-numeric: tabular-nums; }
  .right { text-align: right; }
  h2, h3 { letter-spacing: -.01em; }

  /* controls */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 14px; border: none; background: var(--surface); color: var(--text);
    border-radius: var(--radius-sm); cursor: pointer; font: 500 13px/1.2 inherit; font-family: inherit;
    box-shadow: var(--neu-out-sm); transition: color .15s var(--ease), box-shadow .15s var(--ease), transform .15s var(--ease); white-space: nowrap; }
  .btn:hover { color: var(--accent-bright); }
  .btn:active { box-shadow: var(--neu-in-sm); transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-pressed) 100%); color: #fff;
    box-shadow: var(--neu-out-sm), 0 0 12px var(--accent-glow); }
  .btn-primary:hover { color: #fff; }
  .btn-danger { color: var(--danger); }
  .btn-ghost.btn-danger { color: var(--danger); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-ghost { background: transparent; box-shadow: none; color: var(--text-muted); }
  .btn-ghost:hover { background: var(--surface); }
  .icon-btn { background: none; border: 0; color: var(--text-muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 14px; line-height: 1; }
  .icon-btn:hover { color: var(--text); background: var(--surface); }
  .icon-btn:disabled { opacity: .3; cursor: default; background: none; }
  input[type=text], input[type=email], input[type=password], input[type=tel], input[type=number], select, textarea {
    width: 100%; padding: 8px 10px; background: var(--surface-pressed); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--neu-in-sm);
    font: 13px/1.35 inherit; font-family: inherit; }
  input::placeholder, textarea::placeholder { color: var(--text-faint); }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label.lbl { display: block; font-size: 12px; color: var(--text-muted); margin: 0 0 4px; }
  .hint { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
  .field { margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 12px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px;
    background: var(--surface-raised); color: var(--text); white-space: nowrap; border: 1px solid var(--border-strong); }
  .chip.soft { background: rgba(0,180,216,.12); color: var(--accent-bright); border-color: transparent; }
  .chip.warn { background: rgba(255,183,3,.12); color: var(--warn); border-color: transparent; }
  .chip.off { background: transparent; color: var(--text-faint); border-color: var(--border); }
    .ph { background: var(--surface-raised); padding: 1px 6px; border-radius: 5px; font-size: 12px; color: var(--accent-bright); cursor: pointer; border: 0; font-family: inherit; }

  /* layout */
  .top { height: var(--top-h); display: flex; align-items: center; gap: 18px; padding: 0 18px;
    background: var(--bg-deep); border-bottom: 1px solid var(--border); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; }
  .brand { font-weight: 700; font-size: 16px; display: flex; gap: 10px; align-items: center; white-space: nowrap; }
  .brand .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); display: grid; place-items: center; position: relative; }
  .brand .mark::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--brand-orange); }
  .brand .mark span { color: #fff; font-weight: 800; font-size: 15px; font-style: italic; }
  .brand small { font-weight: 500; color: var(--text-faint); font-size: 12px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { background: none; border: 0; color: var(--text-muted); padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer;
    font: 500 13.5px inherit; font-family: inherit; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent-bright); background: var(--surface); box-shadow: var(--neu-in-sm); }
  .top-right { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 22px 60px; padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
  .view-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .view-head h2 { margin: 0; font-size: 20px; }
  .view-head .sub { flex-basis: 100%; margin-top: -6px; font-size: 13px; color: var(--text-muted); }
  .settings { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 26px; align-items: start; }
  .subnav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(var(--top-h) + 22px); }
  .subnav a { color: var(--text-muted); padding: 8px 12px; border-radius: var(--radius-sm); font-weight: 500; }
  .subnav a:hover { color: var(--text); text-decoration: none; background: var(--surface); }
  .subnav a.active { color: var(--accent-bright); background: var(--surface); box-shadow: var(--neu-in-sm); }
  #sview { min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--neu-out-sm); }
  .panel-pad { padding: 18px; }
  .panel + .panel { margin-top: 16px; }
  .panel h3 { margin: 0 0 4px; font-size: 15px; }
  .panel .desc { margin: 0 0 14px; font-size: 13px; color: var(--text-muted); }

  /* tables */
  .tbl-wrap { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; font-weight: 500; font-size: 12px; color: var(--text-faint); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .tbl th.right { text-align: right; }
  .tbl td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: rgba(255,255,255,.03); }
  .tbl tr.archived td { opacity: .5; }
  .tbl .name { font-weight: 500; }
  .tbl .clip { color: var(--text-faint); font-size: 12px; max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbl input[type=text], .tbl input[type=number] { padding: 6px 8px; }
  .tbl .w-qty { width: 76px; } .tbl .w-price { width: 110px; }
  .tbl tfoot td { border-top: 1px solid var(--border); border-bottom: 0; }
  .empty { padding: 34px 18px; text-align: center; color: var(--text-muted); }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
  .empty p { margin: 0 auto 14px; max-width: 460px; }

  .editor-lines td.drag { width: 58px; white-space: nowrap; }
  .line-wording { display: grid; gap: 8px; padding: 4px 0 6px; }
  .override { color: var(--warn); }
  .totals { display: grid; grid-template-columns: auto 120px; gap: 4px 18px; justify-content: end; padding: 14px 18px; font-size: 13px; }
  .totals .t { font-weight: 700; font-size: 15px; }
  .savebar { position: sticky; bottom: 0; display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 12px 0;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); margin-top: 16px; }
  .savebar .dirty { margin-right: auto; color: var(--warn); font-size: 12.5px; }

  /* auth */
  .auth { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 380px; }
  .auth-card .brand { justify-content: center; margin-bottom: 22px; font-size: 20px; }
  .auth-card .brand .mark { width: 34px; height: 34px; } .auth-card .brand .mark span { font-size: 20px; }
  .auth-card h2 { margin: 0 0 4px; font-size: 18px; }
  .auth-card p { margin: 0 0 16px; color: var(--text-muted); font-size: 13px; }
  .auth-card .btn-primary { width: 100%; padding: 10px; }
  .auth-alt { margin-top: 14px; text-align: center; font-size: 13px; }
  .form-err { color: var(--danger); font-size: 12.5px; margin: -4px 0 12px; }
  .form-ok { color: var(--success); font-size: 12.5px; margin: -4px 0 12px; }

  /* dialog + toast + menu */
  dialog { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface-solid); color: var(--text);
    padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: var(--neu-out); }
  dialog::backdrop { background: rgba(4,8,14,.66); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 6px; }
  .dlg-head h3 { margin: 0; font-size: 16px; }
  .dlg-body { padding: 8px 18px 4px; overflow-y: auto; max-height: calc(100vh - 170px); }
  .dlg-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px 16px; }
  .dlg-foot .left { margin-right: auto; display: flex; gap: 8px; }
  #toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 1000; display: grid; gap: 8px; }
  .toast { background: var(--surface-solid); border: 1px solid var(--border-strong); padding: 10px 16px; border-radius: 10px; box-shadow: var(--neu-out-sm); font-size: 13px; }
  .toast.err { border-color: rgba(239,71,111,.5); color: #ffd3dd; }
  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface-solid); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--neu-out); min-width: 200px; padding: 6px; z-index: 60; }
  .menu-pop .who { padding: 8px 10px; font-size: 12px; color: var(--text-faint); border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .menu-pop button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 8px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
  .menu-pop button:hover { background: var(--surface); }
  input[type=date] { width: 100%; padding: 7px 10px; background: var(--surface-pressed); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); box-shadow: var(--neu-in-sm); font: 13px/1.35 inherit; font-family: inherit; color-scheme: dark; }
  input:disabled, select:disabled, textarea:disabled { opacity: .7; cursor: default; }
  .seg { display: inline-flex; background: var(--surface-pressed); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { background: none; border: 0; color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: 500 12.5px inherit; font-family: inherit; }
  .seg button.on { background: var(--surface-raised); color: var(--text); box-shadow: var(--neu-out-sm); }
  .seg button:disabled { opacity: .4; cursor: default; }
  .chip.st-draft { background: transparent; color: var(--text-muted); border-color: var(--border); }
  .chip.st-sent { background: rgba(0,180,216,.14); color: var(--accent-bright); border-color: transparent; }
  .chip.st-accepted { background: rgba(6,214,160,.14); color: var(--success); border-color: transparent; }
  .chip.st-declined { background: rgba(239,71,111,.14); color: #ff8fa8; border-color: transparent; }
  .chip.st-superseded { background: transparent; color: var(--text-faint); border-color: var(--border); text-decoration: line-through; }
  .notice { background: rgba(0,180,216,.08); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; margin-bottom: 16px; color: var(--text-muted); }
  .qgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; margin-bottom: 16px; }
  .qgrid .panel + .panel { margin-top: 0; }
  .kv { display: grid; gap: 3px; margin: 8px 0 12px; font-size: 13px; }
  .kv > div:first-child { font-weight: 600; font-size: 14px; }
  .kv2 { display: grid; grid-template-columns: 110px 1fr; gap: 5px 10px; font-size: 13px; }
  .loading { padding: 60px; text-align: center; color: var(--text-muted); }


  /* ===================== POOL WATER (matches Commercial Pools / Master Tracker) ===================== */
  :root { --glass: linear-gradient(160deg, rgba(255,255,255,.09) 0%, rgba(24,37,56,.50) 42%, rgba(16,26,41,.60) 100%);
    --glass-shadow: inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 rgba(0,0,0,.22), 0 12px 38px rgba(0,0,0,.38); }
  .water-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .water-bg::before { content: ''; position: absolute; inset: 0;
    background: url('pool-bg.jpg') center/cover no-repeat,
      radial-gradient(ellipse at 20% 15%, rgba(72,202,228,.35), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(0,119,182,.45), transparent 60%),
      linear-gradient(160deg, #0a4d68 0%, #05324a 50%, #031d2e 100%);
    animation: water-drift 46s ease-in-out infinite; will-change: transform; }
  .water-bg::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(9,20,32,.52) 0%, rgba(9,18,29,.62) 55%, rgba(8,15,24,.72) 100%); }
  @keyframes water-drift { 0% { transform: scale(1.08) translate3d(0,0,0); } 50% { transform: scale(1.14) translate3d(-1.5%,-1%,0); } 100% { transform: scale(1.08) translate3d(0,0,0); } }
  @media (prefers-reduced-motion: reduce) { .water-bg::before { animation: none; } }
  body { background: var(--bg); }
  #root { animation: pw-reveal .45s ease-in-out; }
  @keyframes pw-reveal { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: blur(0); } }
  @media (prefers-reduced-motion: reduce) { #root { animation: none; } }
  .panel { background: var(--glass); border: 1px solid var(--border); box-shadow: var(--glass-shadow); }
  .tbl th { background: rgba(20,32,50,.92); }
  .tbl thead tr:first-child th:first-child { border-top-left-radius: var(--radius); }
  .tbl thead tr:first-child th:last-child { border-top-right-radius: var(--radius); }
  .top { background: rgba(10,17,26,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .savebar { background: linear-gradient(to top, rgba(10,17,26,.92) 60%, transparent); }
  .btn { border: 1px solid rgba(255,255,255,.08); }
  .btn-ghost { border-color: transparent; }
  input[type="checkbox"] { -webkit-appearance: none; appearance: none; width: 18px !important; height: 18px !important; margin: 0;
    border: 1.5px solid rgba(255,255,255,.30); border-radius: 5px; background: transparent; position: relative; cursor: pointer; vertical-align: middle; flex: none;
    transition: background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease); }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); box-shadow: 0 3px 10px rgba(0,180,216,.4); }
  input[type="checkbox"]:disabled { opacity: .4; cursor: default; }
  input[type="checkbox"]::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0;
    border-radius: 1px; transform: rotate(45deg) scale(0); opacity: 0; transition: transform .2s cubic-bezier(.34,1.45,.64,1), opacity .12s; }
  input[type="checkbox"]:checked::after { transform: rotate(45deg) scale(1); opacity: 1; }
  @media (prefers-reduced-motion: reduce) { input[type="checkbox"]::after { transition: none; } }

  /* ---------- jobs, follow-ups, today ---------- */
  .nowrap { white-space: nowrap; }
  .credit { color: var(--success); }
  .ok-text { color: var(--success); } .warn-text { color: var(--warn); }
  .stage-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; padding-bottom: 2px; }
  .stage-bar::-webkit-scrollbar { display: none; }
  .stage-bar button { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; font: 500 12.5px inherit; font-family: inherit; white-space: nowrap; }
  .stage-bar button:hover { color: var(--text); }
  .stage-bar button.on { background: var(--accent-pressed); border-color: var(--accent); color: #fff; }
  .stage-bar .n { opacity: .7; margin-left: 3px; font-variant-numeric: tabular-nums; }
  .chip.stg-request, .chip.stg-inspection { background: transparent; color: var(--text-muted); border-color: var(--border); }
  .chip.stg-quote_sent { background: rgba(0,180,216,.14); color: var(--accent-bright); border-color: transparent; }
  .chip.stg-accepted, .chip.stg-disclosure_ack { background: rgba(255,183,3,.13); color: #ffd46b; border-color: transparent; }
  .chip.stg-in_startup { background: rgba(72,202,228,.2); color: #b9f0fb; border-color: transparent; }
  .chip.stg-final_complete { background: rgba(6,214,160,.14); color: var(--success); border-color: transparent; }
  .chip.stg-cancelled { background: transparent; color: var(--text-faint); border-color: var(--border); }
  .chip.out-signed { background: rgba(6,214,160,.16); color: var(--success); border-color: transparent; }
  .chip.out-not_now { background: rgba(255,183,3,.13); color: #ffd46b; border-color: transparent; }
  .chip.out-competitor, .chip.out-diy, .chip.out-other { background: transparent; color: var(--text-muted); border-color: var(--border); }
  .jgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .jcol { display: grid; gap: 16px; } .jcol .panel + .panel { margin-top: 0; }
  .phases { display: grid; gap: 2px; background: rgba(0,0,0,.18); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; }
  .phases > div { display: flex; justify-content: space-between; padding: 3px 0; }
  .phases > div.past { color: var(--text-faint); }
  .insp { display: grid; grid-template-columns: minmax(0, 1fr) 120px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; }
  .insp select, .insp input { padding: 6px 8px; }
  .mini-list { display: grid; gap: 4px; margin-top: 10px; }
  .mini { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); background: rgba(0,0,0,.16);
    border: 1px solid transparent; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; text-align: left; width: 100%; }
  .mini:hover { border-color: var(--border-strong); text-decoration: none; }
  .fu-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--text-faint); vertical-align: 1px; }
  .fu-dot.fu-open { background: var(--accent); } .fu-dot.fu-open.late { background: var(--warn); }
  .fu-dot.fu-done { background: var(--success); } .fu-dot.fu-cancelled, .fu-dot.fu-skipped { background: transparent; border: 1px solid var(--text-faint); }
  .activity { display: grid; gap: 8px; max-height: 360px; overflow-y: auto; }
  .act { font-size: 13px; padding-left: 10px; border-left: 2px solid var(--border); }
  .act.note { border-left-color: var(--brand-orange); }
  .act .faint { font-size: 11.5px; }
  .script { white-space: pre-wrap; background: rgba(0,0,0,.22); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; line-height: 1.5; max-height: 220px; overflow-y: auto; }
  .tgrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .tgrid > div { display: grid; gap: 16px; } .tgrid .panel + .panel { margin-top: 0; }
  .panel h3 .count { font-size: 12px; background: var(--accent-pressed); color: #fff; padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
  .tlist { display: grid; padding: 0 8px 8px; }
  .trow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-sm); background: none; border: 0;
    color: var(--text); font: inherit; text-align: left; cursor: pointer; width: 100%; }
  .trow:hover { background: rgba(255,255,255,.05); }
  .trow + .trow { border-top: 1px solid rgba(255,255,255,.05); }
  .tab .badge { background: var(--warn); color: #1b1300; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; margin-left: 6px; }

  @media (max-width: 820px) {
    .settings { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .savebar { flex-wrap: wrap; }
    .top { gap: 10px; padding: 0 12px; }
    .subnav { flex-direction: row; overflow-x: auto; position: static; scrollbar-width: none; }
    .subnav a { white-space: nowrap; }
    .brand small { display: none; }
    .wrap { padding: 16px 14px 60px; }
    .g2, .g3, .qgrid, .jgrid, .tgrid { grid-template-columns: 1fr; }
    .insp { grid-template-columns: 1fr 110px; } .insp input { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="water-bg" aria-hidden="true"></div>
<div id="root"><div class="loading">Loading…</div></div>
<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
// =====================================================================
// Poolie Start-Up Tool — Phase 1: sign-in + Settings
// =====================================================================

const INITIAL_HASH = location.hash;   // capture before Supabase consumes auth tokens
const CFG = window.POOLIE_CONFIG || {};
const SB_KEY = CFG.SUPABASE_PUBLISHABLE_KEY || CFG.SUPABASE_ANON_KEY;
const sb = (window.supabase && CFG.SUPABASE_URL && SB_KEY) ? window.supabase.createClient(CFG.SUPABASE_URL, SB_KEY) : null;

const PHASES = [['prep','Prep'],['week1','Week 1'],['week2','Week 2'],['week3','Week 3'],['week4','Week 4'],['final','Final'],['none','No timeline']];
const JOIN_PHASES = PHASES.filter(p => p[0] !== 'none');
const TEAMS = [['service','Service'],['repairs','Repairs'],['none','None']];
const PLACEHOLDERS = ['{first_name}','{last_name}','{rep_name}','{final_day}','{address}','{builder}'];
const label = (list, key) => (list.find(p => p[0] === key) || [key, key])[1];

const S = {
  user: null, loaded: false,
  items: [], builders: [], builderPrices: [], templates: [], templateLines: [], cadence: [], settings: {},
  draft: null, dirty: false, showArchived: false,
};

// ---------- small helpers ----------
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const h = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = n => (Number(n) || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
const numOrNull = v => { const s = String(v ?? '').trim().replace(/[$,]/g, ''); if (s === '') return null; const n = Number(s); return Number.isFinite(n) ? n : NaN; };
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const byId = (list, id) => list.find(x => x.id === id);
const opts = (list, sel) => list.map(([v, t]) => `<option value="${h(v)}"${v === sel ? ' selected' : ''}>${h(t)}</option>`).join('');

function toast(msg, isErr) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), isErr ? 6000 : 2800);
}
function fail(err, what) {
  console.error(err);
  toast(`${what}: ${err?.message || err}`, true);
}
async function q(promise, what) {
  const { data, error } = await promise;
  if (error) { fail(error, what); throw error; }
  return data;
}

// ---------- dialog ----------
const dlg = $('#dlg');
function openDialog({ title, body, foot, onMount }) {
  dlg.innerHTML = `<div class="dlg-head"><h3>${h(title)}</h3><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="dlg-body">${body}</div><div class="dlg-foot">${foot || ''}</div>`;
  dlg.querySelectorAll('[data-close]').forEach(b => b.onclick = () => dlg.close());
  dlg.showModal();
  onMount && onMount(dlg);
  const first = dlg.querySelector('input, textarea, select');
  first && first.focus();
}
function confirmDialog(title, message, okText = 'Delete', danger = true) {
  return new Promise(resolve => {
    openDialog({
      title, body: `<p style="margin:0 0 8px">${message}</p>`,
      foot: `<button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="dlg-ok">${h(okText)}</button>`,
      onMount: d => {
        let answered = false;
        d.querySelector('#dlg-ok').onclick = () => { answered = true; d.close(); resolve(true); };
        d.addEventListener('close', () => { if (!answered) resolve(false); }, { once: true });
      }
    });
  });
}

// ---------- pricing ----------
function builderPrice(builderId, itemId) {
  if (!builderId) return null;
  return S.builderPrices.find(p => p.builder_id === builderId && p.item_id === itemId) || null;
}
function resolvedPrice(itemId, builderId) {
  const bp = builderPrice(builderId, itemId);
  if (bp) return Number(bp.price);
  const it = byId(S.items, itemId);
  return it ? Number(it.default_price) : 0;
}
function lineCalc(line, builderId) {
  const it = byId(S.items, line.item_id);
  const list = resolvedPrice(line.item_id, builderId);
  const unit = line.unit_price == null ? list : Number(line.unit_price);
  const qty = Number(line.qty) || 0;
  const isNote = it?.is_note;
  const total = isNote ? 0 : round2(unit * qty);
  return { it, list, unit, qty, total, taxable: !!it?.taxable && !isNote, isNote, overridden: line.unit_price != null && Number(line.unit_price) !== list };
}
function templateTotals(lines, builderId) {
  const rate = Number(S.settings.tax_rate ?? 0.0825);
  let sub = 0, taxBase = 0;
  lines.forEach(l => { const c = lineCalc(l, builderId); sub += c.total; if (c.taxable) taxBase += c.total; });
  const tax = round2(Math.max(0, taxBase) * rate);
  return { sub: round2(sub), tax, total: round2(sub + tax), rate };
}

// ---------- data ----------
async function loadAll() {
  const [items, builders, bps, tpls, tlines, cadence, settings] = await Promise.all([
    q(sb.from('su_items').select('*').order('sort').order('name'), 'Loading line items'),
    q(sb.from('su_builders').select('*').order('name'), 'Loading builders'),
    q(sb.from('su_builder_prices').select('*'), 'Loading price books'),
    q(sb.from('su_templates').select('*').order('sort').order('name'), 'Loading templates'),
    q(sb.from('su_template_lines').select('*').order('sort'), 'Loading template lines'),
    q(sb.from('su_cadence_steps').select('*').order('offset_days').order('sort'), 'Loading follow-ups'),
    q(sb.from('su_settings').select('*'), 'Loading settings'),
  ]);
  const [customers, jobs, quotes] = await Promise.all([
    q(sb.from('su_customers').select('*'), 'Loading customers'),
    q(sb.from('su_jobs').select('*'), 'Loading jobs'),
    q(sb.from('su_quotes').select('*').order('updated_at', { ascending: false }), 'Loading quotes'),
  ]);
  S.followups = await q(sb.from('su_followups').select('*'), 'Loading follow-ups');
  const chk = await sb.from('su_quotes').select('id, options').limit(1);
  S.needsMigration = !!chk.error;
  Object.assign(S, { items, builders, builderPrices: bps, templates: tpls, templateLines: tlines, cadence, customers, jobs, quotes, loaded: true });
  S.settings = Object.fromEntries(settings.map(r => [r.key, r.value]));
}

// ---------- routing ----------
function route() {
  const hsh = location.hash.startsWith('#/') ? location.hash.slice(2) : '';
  const parts = hsh.split('/').filter(Boolean);
  return { tab: parts[0] || 'today', sub: parts[1] || 'items', id: parts[2] || null, parts };
}
function go(path) {
  if (S.dirty && !confirm('You have unsaved changes. Leave without saving?')) return;
  S.dirty = false; S.draft = null;
  if (location.hash === '#/' + path) render(); else location.hash = '#/' + path;
}
window.addEventListener('hashchange', () => { if (S.user) render(); });
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
function markDirty() {
  if (!S.dirty) { S.dirty = true; const d = $('#dirty-flag'); if (d) d.hidden = false; }
}

// =====================================================================
// AUTH
// =====================================================================
function brandHTML(sub = true) {
  return `<div class="brand"><div class="mark" aria-hidden="true"><span>p</span></div>Poolie Start-Ups${sub ? '<small>sales</small>' : ''}</div>`;
}
function renderAuth(mode = 'login', msg = '') {
  const root = $('#root');
  const forms = {
    login: `<h2>Sign in</h2><p>Use the email your invite was sent to.</p>
      <form id="f"><div class="field"><label class="lbl" for="em">Email</label><input id="em" type="email" autocomplete="email" required></div>
      <div class="field"><label class="lbl" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <div class="form-err" id="err" hidden></div><button class="btn btn-primary" type="submit">Sign in</button></form>
      <div class="auth-alt"><a href="#" id="to-forgot">Forgot password?</a></div>`,
    forgot: `<h2>Reset your password</h2><p>We'll email you a link to set a new one.</p>
      <form id="f"><div class="field"><label class="lbl" for="em">Email</label><input id="em" type="email" autocomplete="email" required></div>
      <div class="form-err" id="err" hidden></div><div class="form-ok" id="ok" hidden></div>
      <button class="btn btn-primary" type="submit">Send reset link</button></form>
      <div class="auth-alt"><a href="#" id="to-login">Back to sign in</a></div>`,
    setpw: `<h2>Set your password</h2><p>${h(msg || 'Choose a password to finish setting up your account.')}</p>
      <form id="f"><div class="field"><label class="lbl" for="pw">New password</label><input id="pw" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label class="lbl" for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="hint" style="margin:-6px 0 12px">At least 8 characters.</div>
      <div class="form-err" id="err" hidden></div><button class="btn btn-primary" type="submit">Save password</button></form>`,
  };
  root.innerHTML = `<div class="auth"><div class="auth-card">${brandHTML(false)}<div class="panel panel-pad">${forms[mode]}</div></div></div>`;
  const err = t => { const e = $('#err'); e.textContent = t; e.hidden = !t; };
  if (msg && mode === 'login') err(msg);
  $('#to-forgot') && ($('#to-forgot').onclick = e => { e.preventDefault(); renderAuth('forgot'); });
  $('#to-login') && ($('#to-login').onclick = e => { e.preventDefault(); renderAuth('login'); });
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; err('');
    try {
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
        if (error) throw error;
      } else if (mode === 'forgot') {
        const { error } = await sb.auth.resetPasswordForEmail($('#em').value.trim(), { redirectTo: location.origin + location.pathname });
        if (error) throw error;
        const ok = $('#ok'); ok.textContent = 'Check your email for the reset link.'; ok.hidden = false;
      } else if (mode === 'setpw') {
        if ($('#pw').value !== $('#pw2').value) throw new Error('Passwords don’t match.');
        const { error } = await sb.auth.updateUser({ password: $('#pw').value });
        if (error) throw error;
        toast('Password saved');
        window.__clearInvite && window.__clearInvite();
        history.replaceState(null, '', location.pathname + '#/today');
        await startApp();
      }
    } catch (ex) { err(ex.message || String(ex)); }
    btn.disabled = false;
  };
}

async function startApp() {
  $('#root').innerHTML = '<div class="loading">Loading…</div>';
  try { await loadAll(); } catch (e) {
    $('#root').innerHTML = `<div class="wrap"><div class="panel empty"><strong>Couldn’t load data</strong>
      <p>${h(e.message)}. If this is a new project, make sure supabase/schema.sql has been run in the Supabase SQL Editor.</p>
      <button class="btn" onclick="location.reload()">Try again</button></div></div>`;
    return;
  }
  render();
}

// =====================================================================
// SHELL
// =====================================================================
function render() {
  if (!S.loaded) return;
  const r = route();
  const tabs = [['today','Today'],['jobs','Jobs'],['quotes','Quotes'],['settings','Settings']];
  $('#root').innerHTML = `
    <header class="top">${brandHTML()}
      <nav class="tabs">${tabs.map(([k, t]) => `<button class="tab${r.tab === k ? ' active' : ''}" data-tab="${k}">${t}${k === 'today' && todayCounts() ? `<span class="badge">${todayCounts()}</span>` : ''}</button>`).join('')}</nav>
      <div class="top-right menu"><button class="btn btn-sm btn-ghost" id="me-btn" aria-haspopup="true">${h(S.user.email.split('@')[0])} ▾</button>
        <div class="menu-pop" id="me-menu" hidden><div class="who">${h(S.user.email)}</div>
          <button id="me-details">My details</button><button id="me-pw">Change password</button><button id="me-out">Sign out</button></div></div>
    </header>
    <div class="wrap" id="view"></div>`;
  $$('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab === 'settings' ? 'settings/items' : b.dataset.tab));
  const menu = $('#me-menu');
  $('#me-btn').onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; };
  document.onclick = () => { menu.hidden = true; };
  $('#me-out').onclick = async () => { if (S.dirty && !confirm('Discard unsaved changes and sign out?')) return; S.dirty = false; await sb.auth.signOut(); };
  $('#me-details').onclick = () => myDetailsDialog();
  $('#me-pw').onclick = () => openDialog({
    title: 'Change password',
    body: `<div class="field"><label class="lbl">New password</label><input id="np" type="password" minlength="8" autocomplete="new-password"></div>
      <div class="field"><label class="lbl">Confirm password</label><input id="np2" type="password" minlength="8" autocomplete="new-password"></div>`,
    foot: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="np-save">Save password</button>`,
    onMount: d => d.querySelector('#np-save').onclick = async () => {
      const a = $('#np').value, b = $('#np2').value;
      if (a.length < 8) return toast('Use at least 8 characters.', true);
      if (a !== b) return toast('Passwords don’t match.', true);
      const { error } = await sb.auth.updateUser({ password: a });
      if (error) return fail(error, 'Saving password');
      d.close(); toast('Password saved');
    }
  });

  const view = $('#view');
  if (r.tab === 'settings') return renderSettings(view, r);
  if (r.tab === 'quotes') return renderQuotes(view, r);
  if (r.tab === 'jobs') return renderJobs(view, r);
  return renderToday(view);
}

// =====================================================================
// SETTINGS
// =====================================================================
function renderSettings(view, r) {
  const subs = [['items','Line items'],['builders','Builders & pricing'],['templates','Templates'],['followups','Follow-up schedule'],['general','Quote & disclosure']];
  view.innerHTML = `<div class="settings">
    <nav class="subnav">${subs.map(([k, t]) => `<a href="#/settings/${k}" class="${r.sub === k ? 'active' : ''}" data-sub="${k}">${t}</a>`).join('')}</nav>
    <section id="sview"></section></div>`;
  $$('[data-sub]').forEach(a => a.onclick = e => { e.preventDefault(); go('settings/' + a.dataset.sub); });
  const sv = $('#sview');
  ({ items: viewItems, builders: r.id ? viewBuilderEdit : viewBuilders, templates: r.id ? viewTemplateEdit : viewTemplates,
     followups: viewCadence, general: viewGeneral }[r.sub] || viewItems)(sv, r);
}

// ---------- line items ----------
function viewItems(sv) {
  const list = S.items.filter(i => S.showArchived || i.active);
  const archived = S.items.filter(i => !i.active).length;
  sv.innerHTML = `<div class="view-head"><h2>Line items</h2><div class="grow"></div>
      ${archived ? `<label class="check"><input type="checkbox" id="show-arch"${S.showArchived ? ' checked' : ''}> Show archived (${archived})</label>` : ''}
      <button class="btn btn-primary" id="add">Add line item</button>
      <div class="sub">The standard Poolie price list. Builders can override any price, and templates are built from these items.</div></div>
    <div class="panel tbl-wrap">${list.length ? `<table class="tbl"><thead><tr><th>Item</th><th>Timeline</th><th>Team</th><th class="right">Price</th><th>Tax</th></tr></thead><tbody>
      ${list.map(i => `<tr class="click${i.active ? '' : ' archived'}" data-id="${i.id}">
        <td><div class="name">${h(i.name)}${i.is_note ? ' <span class="chip off">Note</span>' : ''}${i.active ? '' : ' <span class="chip off">Archived</span>'}</div>
          ${i.description ? `<div class="clip">${h(i.description)}</div>` : ''}</td>
        <td>${h(label(PHASES, i.phase))}</td><td>${h(label(TEAMS, i.team))}</td>
        <td class="right num">${i.is_note ? '<span class="faint">—</span>' : money(i.default_price)}</td>
        <td>${i.taxable && !i.is_note ? 'Yes' : '<span class="faint">No</span>'}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty"><strong>No line items yet</strong><p>Add the services you quote, like site prep, weekly visits, and the final walkthrough.</p></div>`}</div>`;
  $('#add').onclick = () => editItem(null);
  $('#show-arch') && ($('#show-arch').onchange = e => { S.showArchived = e.target.checked; viewItems(sv); });
  $$('tr[data-id]', sv).forEach(tr => tr.onclick = () => editItem(byId(S.items, tr.dataset.id)));
}

function editItem(it) {
  const isNew = !it;
  it = it || { name: '', description: '', default_price: 0, taxable: true, team: 'service', phase: 'none', is_note: false, active: true,
               sort: (Math.max(0, ...S.items.map(i => i.sort || 0)) + 10) };
  const usedIn = isNew ? [] : [...new Set(S.templateLines.filter(l => l.item_id === it.id).map(l => byId(S.templates, l.template_id)?.name).filter(Boolean))];
  openDialog({
    title: isNew ? 'Add line item' : 'Edit line item',
    body: `<div class="field"><label class="lbl" for="i-name">Name</label><input id="i-name" type="text" value="${h(it.name)}" placeholder="e.g. Week 2 — 2 Visits"></div>
      <div class="field"><label class="lbl" for="i-desc">Description (prints under the name on quotes)</label><textarea id="i-desc" rows="3">${h(it.description)}</textarea></div>
      <div class="g3">
        <div class="field"><label class="lbl" for="i-price">Standard price</label><input id="i-price" type="text" inputmode="decimal" value="${Number(it.default_price).toFixed(2)}"><div class="hint">Negative for a discount or credit, like -50.</div></div>
        <div class="field"><label class="lbl" for="i-phase">Timeline</label><select id="i-phase">${opts(PHASES, it.phase)}</select></div>
        <div class="field"><label class="lbl" for="i-team">Team</label><select id="i-team">${opts(TEAMS, it.team)}</select></div>
      </div>
      <div class="field" style="display:grid;gap:8px">
        <label class="check"><input type="checkbox" id="i-tax"${it.taxable ? ' checked' : ''}> Charge sales tax</label>
        <label class="check"><input type="checkbox" id="i-note"${it.is_note ? ' checked' : ''}> Note line — prints the text only, no price (for disclaimers)</label>
      </div>
      <div class="field"><label class="lbl" for="i-sort">Sort order</label><input id="i-sort" type="number" step="1" value="${it.sort ?? 0}" style="max-width:120px">
        <div class="hint">Lower numbers appear first in lists and when adding to templates.</div></div>
      ${usedIn.length ? `<div class="hint">Used in: ${usedIn.map(h).join(', ')}</div>` : ''}`,
    foot: `${isNew ? '' : `<div class="left"><button class="btn btn-sm btn-ghost" id="i-arch">${it.active ? 'Archive' : 'Restore'}</button><button class="btn btn-sm btn-ghost btn-danger" id="i-del">Delete</button></div>`}
      <button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="i-save">${isNew ? 'Add item' : 'Save changes'}</button>`,
    onMount: d => {
      d.querySelector('#i-save').onclick = async () => {
        const price = numOrNull($('#i-price').value);
        const row = { name: $('#i-name').value.trim(), description: $('#i-desc').value.trim() || null, default_price: price ?? 0,
          phase: $('#i-phase').value, team: $('#i-team').value, taxable: $('#i-tax').checked, is_note: $('#i-note').checked,
          sort: parseInt($('#i-sort').value, 10) || 0 };
        if (!row.name) return toast('Give the item a name.', true);
        if (Number.isNaN(price)) return toast('Enter a valid price. Use a negative number for a discount or credit.', true);
        try {
          if (isNew) S.items.push((await q(sb.from('su_items').insert({ ...row, active: true }).select().single(), 'Adding item')));
          else Object.assign(it, await q(sb.from('su_items').update(row).eq('id', it.id).select().single(), 'Saving item'));
          S.items.sort((a, b) => (a.sort - b.sort) || a.name.localeCompare(b.name));
          d.close(); toast(isNew ? 'Item added' : 'Item saved'); render();
        } catch (_) {}
      };
      if (!isNew) {
        d.querySelector('#i-arch').onclick = async () => {
          try { Object.assign(it, await q(sb.from('su_items').update({ active: !it.active }).eq('id', it.id).select().single(), 'Updating item'));
            d.close(); toast(it.active ? 'Item restored' : 'Item archived'); render(); } catch (_) {}
        };
        d.querySelector('#i-del').onclick = async () => {
          const msg = usedIn.length
            ? `“${h(it.name)}” is used in ${usedIn.length} template${usedIn.length > 1 ? 's' : ''} (${usedIn.map(h).join(', ')}). Deleting it removes it from those templates. Past quotes keep their copy. Archive it instead if you might need it again.`
            : `Delete “${h(it.name)}”? Past quotes keep their copy of this line.`;
          if (!(await confirmDialog('Delete line item', msg))) return;
          try {
            await q(sb.from('su_template_lines').delete().eq('item_id', it.id), 'Removing from templates');
            await q(sb.from('su_items').delete().eq('id', it.id), 'Deleting item');
            S.items = S.items.filter(x => x.id !== it.id);
            S.templateLines = S.templateLines.filter(l => l.item_id !== it.id);
            S.builderPrices = S.builderPrices.filter(p => p.item_id !== it.id);
            toast('Item deleted'); render();
          } catch (_) {}
        };
      }
    }
  });
}

function viewBuilderEdit(sv, r) {

    const prices = {};

    S.draft = { kind: 'builder', id: r.id, b: src ? { ...src } : { name: '', contact_name: '', email: '', phone: '', notes: '', active: true }, prices };
  }
  const D = S.draft, b = D.b;
  const items = S.items.filter(i => i.active && !i.is_note || D.prices[i.id]);
  sv.innerHTML = `<div class="view-head"><button class="btn btn-sm btn-ghost" id="back">‹ Builders</button><h2>${isNew ? 'New builder' : h(b.name)}</h2></div>
    <div class="panel panel-pad"><h3>Details</h3><p class="desc">Who to contact at the builder.</p>
      <div class="g2">
        <div class="field"><label class="lbl" for="b-name">Company name</label><input id="b-name" type="text" data-f="name" value="${h(b.name)}" placeholder="e.g. LH Custom Pools"></div>
        <div class="field"><label class="lbl" for="b-contact">Contact name</label><input id="b-contact" type="text" data-f="contact_name" value="${h(b.contact_name)}"></div>
        <div class="field"><label class="lbl" for="b-email">Email</label><input id="b-email" type="email" data-f="email" value="${h(b.email)}"></div>
        <div class="field"><label class="lbl" for="b-phone">Phone</label><input id="b-phone" type="tel" data-f="phone" value="${h(b.phone)}"></div>
      </div>
      <div class="field"><label class="lbl" for="b-notes">Notes</label><textarea id="b-notes" data-f="notes" rows="2" placeholder="Contract terms, who pays, notice expectations…">${h(b.notes)}</textarea></div>
      <label class="check"><input type="checkbox" id="b-active"${b.active ? ' checked' : ''}> Active</label>
    </div>
    <div class="panel"><div class="panel-pad" style="padding-bottom:6px"><h3>Contract prices</h3>
      <p class="desc">Leave a price blank to use the standard price. Wording changes print on this builder’s quotes only.</p></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th class="right">Standard</th><th class="right">Builder price</th><th></th></tr></thead><tbody>
      ${items.map(i => { const p = D.prices[i.id] || { price: '', desc: '' };
        return `<tr data-item="${i.id}"><td><div class="name">${h(i.name)}</div>
            <div class="line-wording" ${p.desc ? '' : 'hidden'}><textarea rows="2" data-desc placeholder="${h(i.description || 'Description for this builder')}">${h(p.desc)}</textarea></div></td>
          <td class="right num faint">${money(i.default_price)}</td>
          <td class="right"><input type="text" inputmode="decimal" class="w-price right" data-price value="${h(p.price)}" placeholder="${Number(i.default_price).toFixed(2)}"></td>
          <td><button class="icon-btn" data-wording title="Change wording for this builder" aria-label="Change wording">✎</button></td></tr>`; }).join('')}
      </tbody></table></div></div>
    <div class="savebar"><span class="dirty" id="dirty-flag"${S.dirty ? '' : ' hidden'}>Unsaved changes</span>
      ${isNew ? '' : '<button class="btn btn-ghost btn-danger" id="b-del">Delete builder</button>'}
      <button class="btn" id="b-cancel">Cancel</button><button class="btn btn-primary" id="b-save">${isNew ? 'Add builder' : 'Save changes'}</button></div>`;

  $('#back').onclick = $('#b-cancel').onclick = () => go('settings/builders');
  $$('[data-f]', sv).forEach(el => el.oninput = () => { b[el.dataset.f] = el.value; markDirty(); });
  $('#b-active').onchange = e => { b.active = e.target.checked; markDirty(); };
  $$('tr[data-item]', sv).forEach(tr => {

    const get = () => (D.prices[id] = D.prices[id] || { price: '', desc: '' });
    $('[data-price]', tr).oninput = e => { get().price = e.target.value; markDirty(); };
    $('[data-desc]', tr).oninput = e => { get().desc = e.target.value; markDirty(); };
    $('[data-wording]', tr).onclick = () => { const w = $('.line-wording', tr); w.hidden = !w.hidden; if (!w.hidden) $('textarea', w).focus(); };

  $('#b-save').onclick = async () => {
    if (!b.name.trim()) return toast('Give the builder a name.', true);
    const rows = [];
    for (const [item_id, p] of Object.entries(D.prices)) {
      const price = numOrNull(p.price);
      if (Number.isNaN(price)) return toast(`Check the price for ${byId(S.items, item_id)?.name || 'an item'}.`, true);

    try {
      let saved;
      if (isNew) { saved = await q(sb.from('su_builders').insert(row).select().single(), 'Adding builder'); S.builders.push(saved); }
      else { saved = await q(sb.from('su_builders').update(row).eq('id', src.id).select().single(), 'Saving builder'); Object.assign(src, saved); }
      await q(sb.from('su_builder_prices').delete().eq('builder_id', saved.id), 'Saving prices');
      let inserted = [];
      if (rows.length) inserted = await q(sb.from('su_builder_prices').insert(rows.map(x => ({ ...x, builder_id: saved.id }))).select(), 'Saving prices');
      S.builderPrices = S.builderPrices.filter(p => p.builder_id !== saved.id).concat(inserted);
      S.builders.sort((a, b2) => a.name.localeCompare(b2.name));
      S.dirty = false; S.draft = null; toast(isNew ? 'Builder added' : 'Builder saved'); go('settings/builders');

  };
  $('#b-del') && ($('#b-del').onclick = async () => {
    const tpl = S.templates.filter(t => t.builder_id === src.id).length;
    if (!(await confirmDialog('Delete builder', `Delete ${h(src.name)} and their contract prices?${tpl ? ` Their ${tpl} template${tpl > 1 ? 's' : ''} will become available to all builders.` : ''} Jobs linked to this builder stay, without a builder.`))) return;
    try {
      await q(sb.from('su_builders').delete().eq('id', src.id), 'Deleting builder');
      S.builders = S.builders.filter(x => x.id !== src.id);
      S.builderPrices = S.builderPrices.filter(p => p.builder_id !== src.id);
      S.templates.forEach(t => { if (t.builder_id === src.id) t.builder_id = null; });
      S.dirty = false; toast('Builder deleted'); go('settings/builders');
    } catch (_) {}
  });
}

function viewTemplateEdit(sv, r) {
  const isNew = r.id === 'new';
  const src = isNew ? null : byId(S.templates, r.id);
  if (!isNew && !src) { sv.innerHTML = `<div class="panel empty"><strong>Template not found</strong><p><a href="#/settings/templates">Back to templates</a></p></div>`; return; }
  if (!S.draft || S.draft.kind !== 'template' || S.draft.id !== r.id) {
    S.draft = { kind: 'template', id: r.id,
      t: src ? { ...src } : { name: '', description: '', builder_id: null, join_phase: 'prep', active: true, sort: (Math.max(0, ...S.templates.map(x => x.sort || 0)) + 10) },
      lines: src ? S.templateLines.filter(l => l.template_id === src.id).sort((a, b) => a.sort - b.sort)
        .map(l => ({ item_id: l.item_id, qty: Number(l.qty), unit_price: l.unit_price == null ? null : Number(l.unit_price), name: l.name || '', description: l.description || '', open: !!(l.name || l.description) })) : [] };
  }
  const D = S.draft, t = D.t;
  const builderOpts = [['', 'All builders'], ...S.builders.filter(b => b.active || b.id === t.builder_id).map(b => [b.id, b.name])];
  const addable = S.items.filter(i => i.active);

  const draw = () => {
    const tot = templateTotals(D.lines, t.builder_id);
    $('#lines').innerHTML = D.lines.length ? D.lines.map((l, idx) => {
      const c = lineCalc(l, t.builder_id);
      const nm = l.name || c.it?.name || '(deleted item)';
      return `<tr data-i="${idx}"><td class="drag"><button class="icon-btn" data-up ${idx === 0 ? 'disabled' : ''} aria-label="Move up">↑</button><button class="icon-btn" data-down ${idx === D.lines.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></td>
        <td><div class="name">${h(nm)}${c.isNote ? ' <span class="chip off">Note</span>' : ''} <span class="chip off">${h(label(PHASES, c.it?.phase || 'none'))}</span></div>
          <div class="line-wording" ${l.open ? '' : 'hidden'}>
            <input type="text" data-name placeholder="${h(c.it?.name || 'Name')}" value="${h(l.name)}">
            <textarea rows="2" data-descr placeholder="${h(builderPrice(t.builder_id, l.item_id)?.description_override || c.it?.description || 'Description')}">${h(l.description)}</textarea>
            <div class="hint">Leave blank to use the item’s standard wording.</div></div></td>
        <td class="w-qty">${c.isNote ? '' : `<input type="number" min="0" step="1" data-qty value="${l.qty}" aria-label="Quantity">`}</td>
        <td class="w-price">${c.isNote ? '<span class="faint">—</span>' : `<input type="text" inputmode="decimal" class="right${c.overridden ? ' override' : ''}" data-price value="${l.unit_price == null ? '' : l.unit_price.toFixed(2)}" placeholder="${c.list.toFixed(2)}" aria-label="Unit price">`}</td>
        <td class="right num">${c.isNote ? '' : money(c.total)}</td>
        <td style="white-space:nowrap"><button class="icon-btn" data-wording title="Change wording" aria-label="Change wording">✎</button><button class="icon-btn" data-rm title="Remove line" aria-label="Remove line">✕</button></td></tr>`;
    }).join('') : `<tr><td colspan="6"><div class="empty" style="padding:20px"><strong>No lines yet</strong><p style="margin:0">Add items from the list below.</p></div></td></tr>`;
    $('#totals').innerHTML = `<span class="muted">Subtotal</span><span class="right num">${money(tot.sub)}</span>
      <span class="muted">Tax (${(tot.rate * 100).toFixed(2).replace(/\.?0+$/, '')}%)</span><span class="right num">${money(tot.tax)}</span>
      <span class="t">Total</span><span class="right num t">${money(tot.total)}</span>`;
    $$('#lines tr[data-i]').forEach(tr => {
      const i = +tr.dataset.i, l = D.lines[i];
      const mv = d => { const j = i + d; [D.lines[i], D.lines[j]] = [D.lines[j], D.lines[i]]; markDirty(); draw(); };
      $('[data-up]', tr).onclick = () => mv(-1);
      $('[data-down]', tr).onclick = () => mv(1);
      $('[data-rm]', tr).onclick = () => { D.lines.splice(i, 1); markDirty(); draw(); };
      $('[data-wording]', tr).onclick = () => { l.open = !l.open; draw(); if (l.open) $(`#lines tr[data-i="${i}"] [data-name]`).focus(); };
      const qty = $('[data-qty]', tr); qty && (qty.onchange = () => { l.qty = Math.max(0, Number(qty.value) || 0); markDirty(); draw(); });
      const pr = $('[data-price]', tr); pr && (pr.onchange = () => {
        const v = numOrNull(pr.value);
        if (Number.isNaN(v)) { toast('Enter a valid price, or leave it blank for the standard price.', true); pr.value = l.unit_price == null ? '' : l.unit_price.toFixed(2); return; }
        l.unit_price = v; markDirty(); draw(); });
      $('[data-name]', tr).oninput = e => { l.name = e.target.value; markDirty(); };
      $('[data-descr]', tr).oninput = e => { l.description = e.target.value; markDirty(); };
    });
  };

  sv.innerHTML = `<div class="view-head"><button class="btn btn-sm btn-ghost" id="back">‹ Templates</button><h2>${isNew ? 'New template' : h(t.name)}</h2></div>
    <div class="panel panel-pad">
      <div class="g2">
        <div class="field"><label class="lbl" for="t-name">Template name</label><input id="t-name" type="text" value="${h(t.name)}" placeholder="e.g. Complete Start-Up Package"></div>
        <div class="field"><label class="lbl" for="t-desc">Short description</label><input id="t-desc" type="text" value="${h(t.description)}" placeholder="When to use it"></div>
        <div class="field"><label class="lbl" for="t-builder">Available for</label><select id="t-builder">${opts(builderOpts, t.builder_id || '')}</select>
          <div class="hint">Prices below use this builder’s contract pricing.</div></div>
        <div class="field"><label class="lbl" for="t-join">Start-up begins at</label><select id="t-join">${opts(JOIN_PHASES, t.join_phase)}</select>
          <div class="hint">Use a later week for takeovers of start-ups already in progress.</div></div>
      </div>
      <label class="check"><input type="checkbox" id="t-active"${t.active ? ' checked' : ''}> Show this template when creating quotes</label>
    </div>
    <div class="panel"><div class="tbl-wrap"><table class="tbl editor-lines"><thead><tr><th></th><th>Line</th><th>Qty</th><th class="right">Unit price</th><th class="right">Total</th><th></th></tr></thead>
      <tbody id="lines"></tbody></table></div>
      <div class="panel-pad row" style="border-top:1px solid var(--border)">
        <select id="add-item" class="grow" style="max-width:420px"><option value="">Add a line item…</option>${addable.map(i => `<option value="${i.id}">${h(i.name)}${i.is_note ? ' (note)' : ` — ${money(resolvedPrice(i.id, t.builder_id))}`}</option>`).join('')}</select>
        <span class="hint" style="margin:0">Blank prices use ${t.builder_id ? 'the builder’s contract price' : 'the standard price'}. Changed prices show in amber.</span>
      </div>
      <div class="totals" id="totals"></div></div>
    <div class="savebar"><span class="dirty" id="dirty-flag"${S.dirty ? '' : ' hidden'}>Unsaved changes</span>
      ${isNew ? '' : '<button class="btn btn-ghost btn-danger" id="t-del">Delete</button><button class="btn" id="t-dup">Duplicate</button>'}
      <button class="btn" id="t-cancel">Cancel</button><button class="btn btn-primary" id="t-save">${isNew ? 'Save template' : 'Save changes'}</button></div>`;

  draw();
  $('#back').onclick = $('#t-cancel').onclick = () => go('settings/templates');
  $('#t-name').oninput = e => { t.name = e.target.value; markDirty(); };
  $('#t-desc').oninput = e => { t.description = e.target.value; markDirty(); };
  $('#t-builder').onchange = e => { t.builder_id = e.target.value || null; markDirty(); viewTemplateEdit(sv, r); };
  $('#t-join').onchange = e => { t.join_phase = e.target.value; markDirty(); };
  $('#t-active').onchange = e => { t.active = e.target.checked; markDirty(); };
  $('#add-item').onchange = e => { if (!e.target.value) return; D.lines.push({ item_id: e.target.value, qty: 1, unit_price: null, name: '', description: '', open: false }); e.target.value = ''; markDirty(); draw(); };

  const saveTemplate = async (asCopy) => {
    const name = (asCopy ? `${t.name} (copy)` : t.name).trim();
    if (!name) return toast('Give the template a name.', true);
    const row = { name, description: t.description?.trim() || null, builder_id: t.builder_id || null, join_phase: t.join_phase, active: t.active, sort: t.sort ?? 0 };
    try {
      let saved;
      if (isNew || asCopy) { saved = await q(sb.from('su_templates').insert(row).select().single(), 'Saving template'); S.templates.push(saved); }
      else { saved = await q(sb.from('su_templates').update(row).eq('id', src.id).select().single(), 'Saving template'); Object.assign(src, saved);
        await q(sb.from('su_template_lines').delete().eq('template_id', src.id), 'Saving lines'); }
      const lineRows = D.lines.filter(l => l.item_id).map((l, i) => ({ template_id: saved.id, item_id: l.item_id, qty: l.qty, unit_price: l.unit_price,
        name: l.name.trim() || null, description: l.description.trim() || null, sort: (i + 1) * 10 }));
      let ins = [];
      if (lineRows.length) ins = await q(sb.from('su_template_lines').insert(lineRows).select(), 'Saving lines');
      S.templateLines = S.templateLines.filter(l => l.template_id !== saved.id).concat(ins);
      S.templates.sort((a, b) => (a.sort - b.sort) || a.name.localeCompare(b.name));
      S.dirty = false; S.draft = null;
      toast(asCopy ? 'Template duplicated' : 'Template saved');
      go(asCopy ? 'settings/templates/' + saved.id : 'settings/templates');
    } catch (_) {}
  };
  $('#t-save').onclick = () => saveTemplate(false);
  $('#t-dup') && ($('#t-dup').onclick = () => {
    if (S.dirty) return toast('Save your changes before duplicating.', true);
    saveTemplate(true);
  });
  $('#t-del') && ($('#t-del').onclick = async () => {
    if (!(await confirmDialog('Delete template', `Delete “${h(src.name)}”? Quotes already made from it aren’t affected.`))) return;
    try {
      await q(sb.from('su_templates').delete().eq('id', src.id), 'Deleting template');
      S.templates = S.templates.filter(x => x.id !== src.id);
      S.templateLines = S.templateLines.filter(l => l.template_id !== src.id);
      S.dirty = false; toast('Template deleted'); go('settings/templates');
    } catch (_) {}
  });
}

// ---------- follow-up schedule ----------
const whenText = d => d === 0 ? 'Day of final visit' : d < 0 ? `${-d} day${d === -1 ? '' : 's'} before final` : `${d} day${d === 1 ? '' : 's'} after final`;
function viewCadence(sv) {
  sv.innerHTML = `<div class="view-head"><h2>Follow-up schedule</h2><div class="grow"></div><button class="btn btn-primary" id="add">Add follow-up</button>
      <div class="sub">These tasks are created for every job once its final visit date is set. Reps choose call, text, or email when they log each one.</div></div>
    <div class="panel tbl-wrap">${S.cadence.length ? `<table class="tbl"><thead><tr><th>When</th><th>Name</th><th>Suggested script</th><th></th></tr></thead><tbody>
      ${S.cadence.map(c => `<tr class="click${c.active ? '' : ' archived'}" data-id="${c.id}"><td style="white-space:nowrap">${whenText(c.offset_days)}</td>
        <td class="name">${h(c.label)}</td><td><div class="clip" style="max-width:380px">${h(c.script || '—')}</div></td>
        <td>${c.active ? '' : '<span class="chip off">Off</span>'}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty"><strong>No follow-ups scheduled</strong><p>Add the touches you want before and after each final visit.</p></div>`}</div>`;
  $('#add').onclick = () => editStep(null);
  $$('tr[data-id]', sv).forEach(tr => tr.onclick = () => editStep(byId(S.cadence, tr.dataset.id)));
}
function editStep(c) {
  const isNew = !c;
  c = c || { label: '', offset_days: 0, script: '', active: true, sort: 0 };
  const when = c.offset_days === 0 ? 'on' : c.offset_days < 0 ? 'before' : 'after';
  openDialog({
    title: isNew ? 'Add follow-up' : 'Edit follow-up',

const fmtShort = d => d ? new Date(String(d).length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

async function logActivity(job_id, kind, message, meta = {}) {
  try { await sb.from('su_activity').insert({ job_id, kind, message, meta, created_by: S.user.id }); } catch (_) {}
}
async function advanceJob(job, stage, extra = {}) {
  if (!job || job.stage === 'cancelled') return;
  const patch = { ...extra };
  if (STAGES.indexOf(job.stage) < STAGES.indexOf(stage)) patch.stage = stage;
  if (!Object.keys(patch).length) return;
  try { Object.assign(job, await q(sb.from('su_jobs').update(patch).eq('id', job.id).select().single(), 'Updating job')); } catch (_) {}
}

function lineFromItem(it, builderId, over = {}) {
  const list = it.is_note ? 0 : resolvedPrice(it.id, builderId);
  const bp = builderPrice(builderId, it.id);
  return { item_id: it.id, name: over.name || it.name, description: over.description || bp?.description_override || it.description || '',
    qty: over.qty != null ? Number(over.qty) : 1, unit_price: it.is_note ? 0 : (over.unit_price == null ? list : Number(over.unit_price)),
    list_price: list, taxable: !!it.taxable && !it.is_note, team: it.team, phase: it.phase, is_note: !!it.is_note };
}
function linesFromTemplate(tplId, builderId) {
  return S.templateLines.filter(l => l.template_id === tplId).sort((a, b) => a.sort - b.sort)
    .map(l => { const it = byId(S.items, l.item_id); return it ? lineFromItem(it, builderId, l) : null; }).filter(Boolean);
}
function discountAmount(linesSum, disc) {
  const v = Number(disc?.value);
  if (!disc || !v || v <= 0 || linesSum <= 0) return 0;
  const amt = disc.type === 'percent' ? round2(linesSum * v / 100) : round2(v);
  return Math.min(amt, round2(linesSum));
}
// Quote-level discount is applied before tax, spread across taxable and non-taxable lines in proportion.
function quoteTotals(lines, rate, disc) {
  let lsum = 0, base = 0, savings = 0;
  lines.forEach(l => {
    if (l.is_note) return;
    const qty = Number(l.qty), unit = Number(l.unit_price), t = round2(qty * unit);
    lsum += t; if (l.taxable) base += t;
    if (unit < 0) savings += -t;
    else if (l.list_price != null && Number(l.list_price) > unit) savings += round2((Number(l.list_price) - unit) * qty);
  });
  lsum = round2(lsum);
  const d = discountAmount(lsum, disc);
  const baseAfter = Math.max(0, base - (lsum > 0 ? d * (base / lsum) : 0));
  const tax = round2(baseAfter * Number(rate));
  const sub = round2(lsum - d);
  return { lines: lsum, discount: d, sub, tax, total: round2(sub + tax), savings: round2(savings + d) };
}
const discountLabel = disc => `${disc?.label || 'Discount'}${disc?.type === 'percent' ? ` (${Number(disc.value)}%)` : ''}`;
const templatesFor = builderId => S.templates.filter(t => t.active && (!t.builder_id || t.builder_id === builderId))
  .sort((a, b) => (!!b.builder_id - !!a.builder_id) || (a.sort - b.sort));

              phone: $('#nq-phone').value.trim() || null, address: $('#nq-addr').value.trim() || null, city: $('#nq-city').value.trim() || null,
              state: $('#nq-state').value.trim() || null, zip: $('#nq-zip').value.trim() || null };
            if (!c.first_name && !c.last_name && !c.address) { btn.disabled = false; return toast('Enter a customer name or pool address.', true); }
            customer = await q(sb.from('su_customers').insert(c).select().single(), 'Adding customer'); S.customers.push(customer);
          } else {
            customer = byId(S.customers, $('#nq-cust').value);
            if (!customer) { btn.disabled = false; return toast('Choose a customer.', true); }
            if ($('#nq-job').value !== '__new') job = byId(S.jobs, $('#nq-job').value);
          }
          if (!job) {
            const prev = S.jobs.find(j => j.customer_id === customer.id);
            job = await q(sb.from('su_jobs').insert({ customer_id: customer.id, owner_id: S.user.id, notice_date: todayISO(), stage: 'request', join_phase: 'prep', service_outcome: 'pending',
              builder_id: mode === 'new' ? ($('#nq-builder').value || null) : (prev?.builder_id || null),
              pool_type: mode === 'new' ? $('#nq-type').value : (prev?.pool_type || 'new_build'),
              bill_to: mode === 'new' ? $('#nq-bill').value : (prev?.bill_to || 'homeowner') }).select().single(), 'Creating job');
            S.jobs.push(job); logActivity(job.id, 'job_created', 'Start-up created');
          }
          const tplId = $('#nq-tpl').value || null, tpl = tplId && byId(S.templates, tplId);
          const lines = tpl ? linesFromTemplate(tpl.id, job.builder_id) : [];
          const qt = await createQuote(job, customer, { lines, template: tpl });
          d.close(); toast('Quote created'); go('quotes/' + qt.id);
        } catch (_) { btn.disabled = false; }
      };
    }
  });
}

async function createQuote(job, customer, { lines, template, fromQuote }) {
  const rate = fromQuote ? Number(fromQuote.tax_rate) : Number(S.settings.tax_rate ?? 0.0825);
  const version = Math.max(0, ...S.quotes.filter(x => x.job_id === job.id).map(x => x.version || 1)) + 1;
  const title = fromQuote ? fromQuote.title : `${customer.address || custName(customer)} — Pool Start-Up Quote`;
  const options = fromQuote ? { ...fromQuote.options, ...repInfo() }
    : { ...quoteDefaults(), join_phase: template?.join_phase || 'prep', ...repInfo() };
  const tot = quoteTotals(lines, rate, options.discount);
  const row = { job_id: job.id, ref: newRef(), title, version, status: 'draft', template_id: template?.id || fromQuote?.template_id || null,
    tax_rate: rate, subtotal: tot.sub, tax: tot.tax, total: tot.total, comments: fromQuote?.comments || null,
    disclosure_text: S.settings.disclosure_text || '', expires_on: addDays(todayISO(), Number(S.settings.quote_expiry_days || 30)),
    options, created_by: S.user.id };
  const qt = await q(sb.from('su_quotes').insert(row).select().single(), 'Creating quote');
  if (lines.length) await q(sb.from('su_quote_lines').insert(lines.map((l, i) => ({ ...stripLine(l), quote_id: qt.id, sort: (i + 1) * 10 }))), 'Saving lines');
  S.quotes.push(qt);
  logActivity(job.id, 'quote_created', `Quote #${qt.ref} created${version > 1 ? ` (version ${version})` : ''}`, { quote_id: qt.id });
  return qt;
}
const stripLine = l => ({ item_id: l.item_id || null, name: l.name, description: l.description || null, qty: Number(l.qty) || 0,
  unit_price: Number(l.unit_price) || 0, list_price: l.list_price == null ? null : Number(l.list_price), taxable: !!l.taxable,
  team: l.team || 'none', phase: l.phase || 'none', is_note: !!l.is_note });

      const pr = $('[data-price]', tr); pr && (pr.onchange = () => { const v = numOrNull(pr.value);

  const O = Q.options;

    ${editable ? '' : `<div class="notice">This quote has been ${Q.status === 'superseded' ? 'replaced by a newer version' : Q.status}, so it’s locked to match what the customer received. Use <b>New version</b> to make changes.</div>`}
    <div class="qgrid">
      <div class="panel panel-pad"><div class="row" style="justify-content:space-between;align-items:flex-start"><h3>Customer</h3><div class="row" style="gap:6px"><a class="btn btn-sm" href="#/jobs/${job?.id}">Open job</a><button class="btn btn-sm" id="edit-cust">Edit</button></div></div>
        <div class="kv"><div>${h(custName(cust))}</div><div class="muted">${h(custAddr(cust)) || '<span class="faint">No address</span>'}</div>
          <div class="muted">${[cust?.email, cust?.phone].filter(Boolean).map(h).join('<br>') || '<span class="faint">No contact info</span>'}</div></div>
        <div class="kv2"><span class="faint">Builder</span><span>${builder ? h(builder.name) : '—'}</span>
          <span class="faint">Pool</span><span>${job?.pool_type === 'replaster' ? 'Replaster' : 'New build'}</span>
          <span class="faint">Bill to</span><span>${job?.bill_to === 'builder' ? 'Builder' : 'Homeowner'}</span></div>
        ${others.length ? `<div class="kv2" style="margin-top:10px"><span class="faint">Other versions</span><span>${others.map(o => `<a href="#/quotes/${o.id}">v${o.version}</a> ${statusChip(o.status)}`).join('<br>')}</span></div>` : ''}
      </div>
      <div class="panel panel-pad"><h3>Quote details</h3>
        <div class="field"><label class="lbl" for="q-title">Title on the PDF</label><input id="q-title" type="text" value="${h(Q.title)}"${dis}></div>
        <div class="g2">
          <div class="field"><label class="lbl" for="q-exp">Valid until</label><input id="q-exp" type="date" value="${h(Q.expires_on || '')}"${dis}></div>
          <div class="field"><label class="lbl" for="q-join">Start-up begins at</label><select id="q-join"${dis}>${opts(JOIN_PHASES, O.join_phase || 'prep')}</select></div>
        </div>
        <div class="field" style="margin:0"><label class="lbl" for="q-comments">Notes to the customer (optional)</label><textarea id="q-comments" rows="2" placeholder="Prints above the line items"${dis}>${h(Q.comments || '')}</textarea></div>
      </div>
    </div>
    <div class="panel">
      ${editable ? `<div class="panel-pad row" style="border-bottom:1px solid var(--border)"><span class="muted" style="font-size:13px">Replace lines with template</span>
        <select id="q-tpl" style="max-width:320px"><option value="">Choose a template…</option>${templatesFor(job?.builder_id).map(t => `<option value="${t.id}">${h(t.name)}</option>`).join('')}</select></div>` : ''}
      <div class="tbl-wrap"><table class="tbl editor-lines"><thead><tr>${editable ? '<th></th>' : ''}<th>Line</th><th>Qty</th><th class="right">Unit price</th><th class="right">Total</th>${editable ? '<th></th>' : ''}</tr></thead><tbody id="q-lines"></tbody></table></div>
      ${editable ? `<div class="panel-pad row" style="border-top:1px solid var(--border)">
        <select id="q-add" style="max-width:380px"><option value="">Add a line item…</option>${S.items.filter(i => i.active).map(i => `<option value="${i.id}">${h(i.name)}${i.is_note ? ' (note)' : ` — ${money(resolvedPrice(i.id, job?.builder_id))}`}</option>`).join('')}</select>
        <button class="btn btn-sm" id="q-custom">Custom line</button><button class="btn btn-sm" id="q-disc">Add discount</button></div>` : ''}
      <div class="totals" id="q-totals"></div>
    </div>
    <div class="panel panel-pad"><h3>What prints on the PDF</h3><p class="desc">Defaults come from Settings → Quote & disclosure.</p>
      <div style="display:grid;gap:8px">
        <label class="check"><input type="checkbox" id="o-disc"${O.show_disclosure ? ' checked' : ''}${dis}> Plaster start-up disclosure</label>
        <label class="check"><input type="checkbox" id="o-ack"${O.show_ack ? ' checked' : ''}${dis}> Acknowledge by text or email instructions</label>
        <label class="check"><input type="checkbox" id="o-sig"${O.show_signature ? ' checked' : ''}${dis}> Signature, date, and printed name block</label>
        <label class="check"><input type="checkbox" id="o-savings"${O.show_savings ? ' checked' : ''}${dis}> Show savings (original prices crossed out and “You save”)</label>
      </div></div>
    <div class="savebar"><span class="dirty" id="dirty-flag"${S.dirty ? '' : ' hidden'}>Unsaved changes</span>
      ${Q.status === 'draft' ? '<button class="btn btn-ghost btn-danger" id="q-del">Delete draft</button>' : ''}
      <button class="btn" id="q-tpl-save">Save as template</button>
      ${Q.status !== 'draft' ? '<button class="btn" id="q-ver">New version</button>' : ''}
      ${Q.status === 'draft' ? '<button class="btn" id="q-save">Save draft</button><button class="btn" id="q-sent">Mark as sent</button>' : ''}
      ${Q.status === 'sent' ? '<button class="btn" id="q-decl">Mark declined</button><button class="btn" id="q-acc">Mark accepted</button>' : ''}

  drawLines();
  $('#back').onclick = () => go('quotes');
  $('#edit-cust').onclick = () => editCustomer(job, cust, () => { S.draft = D; viewQuoteEdit(view, id); });
  if (editable) {
    $('#q-title').oninput = e => { Q.title = e.target.value; markDirty(); };
    $('#q-exp').onchange = e => { Q.expires_on = e.target.value || null; markDirty(); };
    $('#q-join').onchange = e => { O.join_phase = e.target.value; markDirty(); };
    $('#q-comments').oninput = e => { Q.comments = e.target.value; markDirty(); };
    $('#o-disc').onchange = e => { O.show_disclosure = e.target.checked; markDirty(); };
    $('#o-ack').onchange = e => { O.show_ack = e.target.checked; markDirty(); };
    $('#o-sig').onchange = e => { O.show_signature = e.target.checked; markDirty(); };
    $('#o-savings').onchange = e => { O.show_savings = e.target.checked; markDirty(); };
    $('#q-tpl').onchange = async e => {
      const t = byId(S.templates, e.target.value); e.target.value = ''; if (!t) return;
