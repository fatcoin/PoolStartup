      D.lines = linesFromTemplate(t.id, job?.builder_id); Q.template_id = t.id; O.join_phase = t.join_phase; $('#q-join').value = t.join_phase; markDirty(); drawLines();
    };
    $('#q-add').onchange = e => { const it = byId(S.items, e.target.value); e.target.value = ''; if (!it) return; D.lines.push(lineFromItem(it, job?.builder_id)); markDirty(); drawLines(); };
    $('#q-custom').onclick = () => editLine(null, nl => { D.lines.push(nl); markDirty(); drawLines(); });
    $('#q-disc').onclick = () => discountDialog(O.discount, quoteTotals(D.lines, Q.tax_rate).lines, dsc => { if (dsc) O.discount = dsc; else delete O.discount; markDirty(); drawLines(); });
  }

  const save = async () => {
    if (!Q.title.trim()) { toast('Give the quote a title.', true); return false; }
    const tot = quoteTotals(D.lines, Q.tax_rate, O.discount);
    const row = { title: Q.title.trim(), expires_on: Q.expires_on || null, comments: Q.comments?.trim() || null, template_id: Q.template_id || null,
      options: { ...O, ...repInfo() }, subtotal: tot.sub, tax: tot.tax, total: tot.total, disclosure_text: S.settings.disclosure_text || '' };
    try {
      Object.assign(qt, await q(sb.from('su_quotes').update(row).eq('id', id).select().single(), 'Saving quote'));
      await q(sb.from('su_quote_lines').delete().eq('quote_id', id), 'Saving lines');
      if (D.lines.length) await q(sb.from('su_quote_lines').insert(D.lines.map((l, i) => ({ ...stripLine(l), quote_id: id, sort: (i + 1) * 10 }))), 'Saving lines');
      Object.assign(Q, qt, { options: { ...O, ...repInfo() } }); S.dirty = false; const f = $('#dirty-flag'); f && (f.hidden = true);
      return true;
    } catch (_) { return false; }
  };
  const setStatus = async (status, extra = {}) => {
    try { Object.assign(qt, await q(sb.from('su_quotes').update({ status, ...extra }).eq('id', id).select().single(), 'Updating quote')); } catch (_) { return false; }
    Object.assign(Q, { status: qt.status, sent_at: qt.sent_at, accepted_at: qt.accepted_at }); return true;
  };
  const rerender = () => { S.draft = null; S.dirty = false; viewQuoteEdit(view, id); };

  $('#q-save') && ($('#q-save').onclick = async () => { if (await save()) toast('Draft saved'); });
  $('#q-pdf').onclick = async () => {
    const btn = $('#q-pdf'); btn.disabled = true; btn.textContent = 'Preparing PDF…';
    try {
      if (editable && S.dirty && !(await save())) return;
      await downloadQuotePdf(Q, D.lines, job, cust, builder);
      logActivity(job.id, 'pdf_downloaded', `PDF downloaded for quote #${Q.ref}`, { quote_id: id });
    } catch (e) { fail(e, 'Making PDF'); }
    finally { btn.disabled = false; btn.textContent = 'Download PDF'; }
  };
  $('#q-sent') && ($('#q-sent').onclick = async () => {
    if (!D.lines.length) return toast('Add at least one line before marking the quote sent.', true);
    if (!(await confirmDialog('Mark as sent', 'This locks the quote so it matches what the customer received. You can still make a new version later.', 'Mark as sent', false))) return;
    if (!(await save())) return;
    if (!(await setStatus('sent', { sent_at: new Date().toISOString() }))) return;
    for (const o of S.quotes.filter(x => x.job_id === Q.job_id && x.id !== id && ['draft','sent'].includes(x.status))) {
      try { Object.assign(o, await q(sb.from('su_quotes').update({ status: 'superseded' }).eq('id', o.id).select().single(), 'Updating older versions')); } catch (_) {}
    }
    await advanceJob(job, 'quote_sent');
    logActivity(job.id, 'quote_sent', `Quote #${Q.ref} sent`, { quote_id: id });
    toast('Marked as sent'); rerender();
  });
  $('#q-acc') && ($('#q-acc').onclick = async () => {
    if (!(await setStatus('accepted', { accepted_at: new Date().toISOString() }))) return;
    await advanceJob(job, 'accepted', { join_phase: O.join_phase || 'prep' });
    logActivity(job.id, 'quote_accepted', `Quote #${Q.ref} accepted (${money(Q.total)})`, { quote_id: id });
    toast(job.disclosure_ack ? 'Marked accepted' : 'Marked accepted. Remember to record the disclosure acknowledgment.'); rerender();
  });
  $('#q-decl') && ($('#q-decl').onclick = async () => {
    if (!(await setStatus('declined'))) return;
    logActivity(job.id, 'quote_declined', `Quote #${Q.ref} declined`, { quote_id: id });
    toast('Marked declined'); rerender();
  });
  $('#q-ver') && ($('#q-ver').onclick = async () => {
    try { const nq = await createQuote(job, cust, { lines: D.lines, fromQuote: Q }); S.draft = null; toast(`Version ${nq.version} created`); go('quotes/' + nq.id); } catch (_) {}
  });
  $('#q-del') && ($('#q-del').onclick = async () => {
    if (!(await confirmDialog('Delete draft', `Delete draft quote #${h(Q.ref)}? The customer and job stay.`))) return;
    try { await q(sb.from('su_quotes').delete().eq('id', id), 'Deleting quote'); S.quotes = S.quotes.filter(x => x.id !== id); S.dirty = false; S.draft = null; toast('Draft deleted'); go('quotes'); } catch (_) {}
  });
  $('#q-tpl-save').onclick = () => saveQuoteAsTemplate(D.lines, job, Q);
}

function discountDialog(cur, linesSum, onSave) {
  const d0 = cur || { label: 'Discount', type: 'percent', value: '' };
  openDialog({
    title: cur ? 'Edit discount' : 'Add discount',
    body: `<p class="desc" style="margin:0 0 12px">Taken off the whole quote before tax. To discount one line instead, change its price.</p>
      <div class="field"><label class="lbl" for="ds-label">Label on the quote</label><input id="ds-label" type="text" value="${h(d0.label)}" placeholder="e.g. Builder partner discount"></div>
      <div class="g2"><div class="field"><label class="lbl" for="ds-type">Type</label><select id="ds-type">${opts([['percent','Percent off'],['amount','Dollar amount off']], d0.type)}</select></div>
        <div class="field"><label class="lbl" for="ds-val">Amount</label><input id="ds-val" type="text" inputmode="decimal" value="${h(d0.value)}" placeholder="${d0.type === 'percent' ? '10' : '100.00'}"></div></div>
      <div class="hint" id="ds-prev"></div>`,
    foot: `${cur ? '<div class="left"><button class="btn btn-sm btn-ghost btn-danger" id="ds-rm">Remove discount</button></div>' : ''}<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="ds-ok">${cur ? 'Save discount' : 'Add discount'}</button>`,
    onMount: d => {
      const prev = () => { const v = numOrNull($('#ds-val').value), t = $('#ds-type').value;
        $('#ds-val').placeholder = t === 'percent' ? '10' : '100.00';
        $('#ds-prev').textContent = v > 0 ? `Takes ${money(discountAmount(linesSum, { type: t, value: v }))} off the ${money(linesSum)} subtotal.` : ''; };
      $('#ds-val').oninput = prev; $('#ds-type').onchange = prev; prev();
      $('#ds-ok').onclick = () => {
        const v = numOrNull($('#ds-val').value), t = $('#ds-type').value;
        if (v == null || Number.isNaN(v) || v <= 0) return toast('Enter an amount greater than 0.', true);
        if (t === 'percent' && v > 100) return toast('A percent discount can’t be more than 100%.', true);
        d.close(); onSave({ label: $('#ds-label').value.trim() || 'Discount', type: t, value: v });
      };
      $('#ds-rm') && ($('#ds-rm').onclick = () => { d.close(); onSave(null); });
    }
  });
}

function editLine(line, onSave) {
  const isNew = !line;
  const l = line ? { ...line } : { item_id: null, name: '', description: '', qty: 1, unit_price: 0, list_price: null, taxable: true, team: 'none', phase: 'none', is_note: false };

// ---------- PDF ----------
let _pdfLib, _logo;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Couldn’t load ' + src)); document.head.appendChild(s); });
}
async function pdfLib() {
  if (!_pdfLib) _pdfLib = (async () => {
    await loadScript('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js');
    return window.pdfMake;
  })().catch(e => { _pdfLib = null; throw e; });
  return _pdfLib;
}
async function logoData() {
  if (_logo !== undefined) return _logo;
  try {
    const blob = await (await fetch('poolie-logo.png', { cache: 'force-cache' })).blob();
    if (!blob.type.startsWith('image/')) throw new Error('not an image');
    _logo = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  } catch (_) { _logo = null; }
  return _logo;
}

function disclosureBlocks(text, C) {
  // The disclosure's own "acknowledgment" section is replaced by the per-quote options (text/email box and/or signature block).
  const out = []; let bullets = [], para = [], skipping = false;
  const flushB = () => { if (bullets.length) { out.push({ ul: bullets.map(b => ({ text: b, margin: [0, 0, 0, 2] })), margin: [0, 0, 0, 6], color: C.ink }); bullets = []; } };
  const flushP = () => { if (para.length) { out.push({ text: para.join(' '), margin: [0, 0, 0, 6] }); para = []; } };
  String(text || '').split('\n').forEach((raw, idx) => {
    const t = raw.trim();
    if (!t) { flushB(); flushP(); return; }
    if (/^[-•]\s+/.test(t)) { flushP(); bullets.push(t.replace(/^[-•]\s+/, '')); return; }
    const isHead = t.length < 80 && /[A-Z]/.test(t) && t === t.toUpperCase();
    if (isHead) { flushB(); flushP(); skipping = /ACKNOWLEDG/.test(t) && idx > 0; if (!skipping) out.push(idx === 0 ? { text: t, style: 'discTitle' } : { text: t, style: 'discHead' }); return; }
    if (skipping && !/^This document references/i.test(t)) return;
    flushB(); para.push(t);
  });
  flushB(); flushP();
  return out;
}

function buildQuotePdf(Q, lines, job, cust, builder, logo) {
  const C = { blue: '#1676B7', orange: '#F39A2B', ink: '#1E2B38', mute: '#5E6E7E', rule: '#DCE3EA', tint: '#F1F6FA', green: '#1E8C5A' };
  const co = S.settings.company || {}, O = { ...quoteDefaults(), ...(Q.options || {}) };
  const tot = quoteTotals(lines, Q.tax_rate, O.discount);
  const W = 516;
  const coLine = [co.address, [co.city, [co.state, co.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ')].filter(Boolean).join(', ');
  const partyBlock = (heading, rows) => ({ stack: [{ text: heading, style: 'label' }, ...rows.filter(Boolean).map((r, i) => ({ text: r, bold: i === 0, margin: [0, i === 0 ? 2 : 1, 0, 0] }))] });
  const custRows = [custName(cust), cust?.address, [cust?.city, [cust?.state, cust?.zip].filter(Boolean).join(' ')].filter(Boolean).join(', '), cust?.email, cust?.phone];
  const parties = [];
  if (job?.bill_to === 'builder' && builder) {
    parties.push(partyBlock('Bill to', [builder.name, builder.contact_name, builder.email, builder.phone]));
    parties.push(partyBlock('Service address', custRows));
  } else {
    parties.push(partyBlock('Prepared for', custRows));
    if (builder) parties.push(partyBlock('Builder', [builder.name, builder.contact_name]));
  }
  parties.push(partyBlock('Prepared by', [O.rep_name, co.name, O.rep_email, O.rep_phone]));

  const body = [[{ text: 'Service', style: 'th' }, { text: 'Qty', style: 'th', alignment: 'center' }, { text: 'Price', style: 'th', alignment: 'right' }, { text: 'Amount', style: 'th', alignment: 'right' }]];
  const noteRows = new Set();
  lines.forEach(l => {
    if (l.is_note) {
      noteRows.add(body.length);
      body.push([{ colSpan: 4, stack: [{ text: l.name, bold: true, color: C.ink }, l.description ? { text: l.description, color: C.mute, margin: [0, 2, 0, 0] } : ''], fillColor: C.tint, margin: [4, 4, 4, 4] }, '', '', '']);
      return;
    }
    body.push([
      { stack: [{ text: l.name, bold: true }, l.description ? { text: l.description, color: C.mute, fontSize: 8.5, margin: [0, 2, 0, 0] } : ''] },
      { text: fmtQty(l.qty), alignment: 'center' },
      (O.show_savings && l.list_price != null && Number(l.list_price) > Number(l.unit_price) && Number(l.unit_price) >= 0)
        ? { stack: [{ text: money(l.list_price), decoration: 'lineThrough', color: C.mute, fontSize: 8 }, { text: money(l.unit_price), color: C.green }], alignment: 'right' }
        : { text: money(l.unit_price), alignment: 'right', color: Number(l.unit_price) < 0 ? C.green : C.ink },
      { text: money(l.qty * l.unit_price), alignment: 'right', color: Number(l.unit_price) < 0 ? C.green : C.ink },
    ]);
  });

  const totRows = [[{ text: 'Subtotal', color: C.mute }, { text: money(tot.lines), alignment: 'right' }]];
  if (tot.discount) totRows.push([{ text: discountLabel(O.discount), color: C.green }, { text: '−' + money(tot.discount), alignment: 'right', color: C.green }]);
  totRows.push([{ text: `Tax (${(Number(Q.tax_rate) * 100).toFixed(3).replace(/\.?0+$/, '')}%)`, color: C.mute }, { text: money(tot.tax), alignment: 'right' }]);
  const totalIdx = totRows.length;
  totRows.push([{ text: 'Total', bold: true, fontSize: 12, color: C.blue, margin: [0, 3, 0, 0] }, { text: money(tot.total), bold: true, fontSize: 12, alignment: 'right', color: C.blue, margin: [0, 3, 0, 0] }]);
  const content = [
    { columns: [
        logo ? { image: logo, width: 118 } : { text: co.name || 'Poolie', fontSize: 22, bold: true, color: C.blue },
        { width: '*', stack: [
          { text: 'Pool Start-Up Quote', fontSize: 17, bold: true, alignment: 'right', color: C.ink },
          { text: `Quote #${Q.ref}${Q.version > 1 ? ` (v${Q.version})` : ''}`, alignment: 'right', color: C.mute, margin: [0, 4, 0, 0] },
          { text: `Date: ${fmtDate(Q.sent_at || Q.updated_at || Q.created_at)}`, alignment: 'right', color: C.mute },
          Q.expires_on ? { text: `Valid until: ${fmtDate(Q.expires_on)}`, alignment: 'right', color: C.mute } : '' ] } ] },
    { canvas: [{ type: 'rect', x: 0, y: 0, w: W, h: 2.5, color: C.blue }, { type: 'rect', x: 0, y: 0, w: 56, h: 2.5, color: C.orange }], margin: [0, 16, 0, 16] },
    { text: Q.title, fontSize: 14, bold: true, color: C.ink, margin: [0, 0, 0, 12] },
    { columns: parties.map(p => ({ width: '*', ...p })), columnGap: 18, margin: [0, 0, 0, 18] },
    Q.comments ? { text: Q.comments, margin: [0, 0, 0, 14], color: C.ink } : '',
    { table: { headerRows: 1, widths: ['*', 34, 66, 72], body, dontBreakRows: true },
      layout: { hLineWidth: (i, n) => (i === 1 ? 1.2 : (i === 0 || i === n.table.body.length) ? 0 : 0.5),
        hLineColor: i => (i === 1 ? C.blue : C.rule), vLineWidth: () => 0,
        paddingTop: i => (i === 0 ? 0 : 7), paddingBottom: i => (i === 0 ? 5 : 7), paddingLeft: () => 4, paddingRight: () => 4 } },
    { columns: [{ width: '*', text: '' }, { width: 230, margin: [0, 10, 0, 0], table: { widths: ['*', 80], body: totRows },
      layout: { hLineWidth: i => (i === totalIdx ? 1 : 0), hLineColor: () => C.rule, vLineWidth: () => 0, paddingTop: () => 3, paddingBottom: () => 3, paddingLeft: () => 0, paddingRight: () => 4 } }] },
    (O.show_savings && tot.savings > 0) ? { text: `You save ${money(tot.savings)}`, alignment: 'right', color: C.green, bold: true, margin: [0, 4, 4, 0] } : '',
  ];

  if (O.show_disclosure && (Q.disclosure_text || S.settings.disclosure_text)) {
    content.push({ stack: disclosureBlocks(Q.disclosure_text || S.settings.disclosure_text, C), fontSize: 8.5, color: C.ink, margin: [0, 26, 0, 0] });
  }
  if (O.show_ack) {
    const stmt = S.settings.ack_statement || 'I have received and acknowledged the Poolie Pool Service Plaster Start-Up Disclosure & Liability Waiver.';
    content.push({ unbreakable: true, margin: [0, 14, 0, 0], table: { widths: ['*'], body: [[{ fillColor: C.tint, margin: [12, 10, 12, 10], stack: [
      { text: 'How to acknowledge this disclosure', bold: true, color: C.blue, fontSize: 10.5, margin: [0, 0, 0, 5] },
      { text: ['Reply to this quote by ', { text: 'text or email', bold: true }, ' with this message:'] },
      { text: `“${stmt}”`, italics: true, margin: [0, 5, 0, 5] },
      { text: 'Your reply serves as electronic acknowledgment. No physical signature is required. A copy is kept with your account.', color: C.mute, fontSize: 8.5 } ] }]] },
      layout: { hLineWidth: () => 0, vLineWidth: i => (i === 0 ? 3 : 0), vLineColor: () => C.blue } });
  }
  if (O.show_signature) {
    const sigLine = (lbl, w) => ({ width: w, stack: [{ canvas: [{ type: 'line', x1: 0, y1: 0, x2: w === '*' ? 230 : w, y2: 0, lineWidth: 0.8, lineColor: C.ink }], margin: [0, 30, 0, 3] }, { text: lbl, color: C.mute, fontSize: 8.5 }] });
    content.push({ unbreakable: true, margin: [0, 20, 0, 0], stack: [
      { text: 'Acceptance', bold: true, fontSize: 10.5, color: C.ink },
      { text: 'By signing, you accept this quote and acknowledge the plaster start-up disclosure above.', color: C.mute, fontSize: 8.5, margin: [0, 2, 0, 0] },
      { columns: [sigLine('Signature', 230), { width: 30, text: '' }, sigLine('Date', 140)] },
      { columns: [sigLine('Printed name', 230)] } ] });
  }

  return {
    pageSize: 'LETTER', pageMargins: [48, 48, 48, 56],
    info: { title: Q.title, author: co.name || 'Poolie', subject: `Quote #${Q.ref}` },
    footer: (cur, count) => ({ margin: [48, 18, 48, 0], columns: [
      { text: [co.name, coLine, co.phone].filter(Boolean).join('   |   '), fontSize: 7.5, color: C.mute },
      { text: `Page ${cur} of ${count}`, alignment: 'right', fontSize: 7.5, color: C.mute, width: 70 } ] }),
    content,
    styles: {
      label: { fontSize: 8, color: C.mute, bold: true },
      th: { fontSize: 8.5, bold: true, color: C.mute },
      discTitle: { fontSize: 11, bold: true, color: C.blue, margin: [0, 0, 0, 6] },
      discHead: { fontSize: 9, bold: true, color: C.ink, margin: [0, 6, 0, 3] },
    },
    defaultStyle: { fontSize: 9.5, color: C.ink, lineHeight: 1.2 },
  };
}

async function downloadQuotePdf(Q, lines, job, cust, builder) {
  const [pm, logo] = await Promise.all([pdfLib(), logoData()]);

  pm.createPdf(dd).download(name);
}

const STAGE_LABELS = [['request','New request'],['inspection','Pre-start inspection'],['quote_sent','Quote sent'],['accepted','Accepted'],
  ['disclosure_ack','Disclosure acknowledged'],['in_startup','In start-up'],['final_complete','Complete'],['cancelled','Cancelled']];
const OUTCOMES = [['pending','Pending'],['signed','Signed service'],['not_now','Not now'],['competitor','Competitor'],['diy','DIY'],['other','Other']];
const CLOSED_OUTCOMES = ['signed','competitor','diy'];
const CHANNELS = [['call','Call'],['text','Text'],['email','Email'],['in_person','In person'],['other','Other']];
const stageChip = s => `<span class="chip stg-${s}">${h(label(STAGE_LABELS, s))}</span>`;
const outcomeChip = o => o === 'pending' ? '<span class="faint">Pending</span>' : `<span class="chip out-${o}">${h(label(OUTCOMES, o))}</span>`;
const diffDays = (a, b) => Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 86400000);
const fmtDay = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) : '';
const fmtDow = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
const phaseOffsets = () => ({ prep: 0, week1: 1, week2: 7, week3: 14, week4: 21, final: 28, ...(S.settings.phase_offsets || {}) });
const acceptedQuote = job => S.quotes.filter(x => x.job_id === job.id && x.status === 'accepted').sort((a, b) => b.version - a.version)[0];
const latestQuote = job => S.quotes.filter(x => x.job_id === job.id && x.status !== 'superseded').sort((a, b) => b.version - a.version)[0];
const jobTitle = job => { const c = custOf(job); return c?.address || custName(c); };
const telHref = p => 'tel:' + String(p || '').replace(/[^\d+]/g, '');
const smsHref = (p, body) => 'sms:' + String(p || '').replace(/[^\d+]/g, '') + '?&body=' + encodeURIComponent(body || '');

function computedFinal(job) {
  if (!job.start_date) return null;
  const o = phaseOffsets(); return addDays(job.start_date, (o.final ?? 28) - (o[job.join_phase] ?? 0));
}
function relDays(d) {
  if (!d) return '';
  const n = diffDays(d, todayISO());
  return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n > 0 ? `in ${n} days` : `${-n} days ago`;
}
function fillScript(text, job) {
  const c = custOf(job), b = job && byId(S.builders, job.builder_id), md = S.user.user_metadata || {};
  const map = { first_name: c?.first_name || 'there', last_name: c?.last_name || '', rep_name: (md.full_name || '').split(' ')[0] || md.full_name || 'the Poolie team',
    final_day: job?.final_date ? fmtDay(job.final_date) : '[final visit day]', address: c?.address || 'your pool', builder: b?.name || 'your builder' };
  return String(text || '').replace(/\{(\w+)\}/g, (m, k) => (k in map ? map[k] : m));
}

// ---------- follow-up engine ----------
async function syncFollowups(job) {
  const mine = S.followups.filter(f => f.job_id === job.id);
  const closed = CLOSED_OUTCOMES.includes(job.service_outcome) || job.stage === 'cancelled';
  if (closed) return cancelOpenFollowups(job);
  if (!job.final_date) return;
  const inserts = [];
  for (const step of S.cadence.filter(c => c.active)) {
    const due = addDays(job.final_date, step.offset_days);
    const f = mine.find(x => x.step_id === step.id);
    if (!f) inserts.push({ job_id: job.id, step_id: step.id, label: step.label, due_date: due, status: 'open' });
    else if (f.status === 'open' && f.due_date !== due) {
      try { Object.assign(f, await q(sb.from('su_followups').update({ due_date: due, label: step.label }).eq('id', f.id).select().single(), 'Rescheduling follow-up')); } catch (_) {}
    }
  }
  if (inserts.length) { try { S.followups.push(...await q(sb.from('su_followups').insert(inserts).select(), 'Creating follow-ups')); } catch (_) {} }
}
async function cancelOpenFollowups(job) {
  const open = S.followups.filter(f => f.job_id === job.id && f.status === 'open');
  if (!open.length) return;
  try { await q(sb.from('su_followups').update({ status: 'cancelled' }).eq('job_id', job.id).eq('status', 'open'), 'Closing follow-ups'); open.forEach(f => f.status = 'cancelled'); } catch (_) {}
}
async function setOutcome(job, outcome, note) {
  try {
    Object.assign(job, await q(sb.from('su_jobs').update({ service_outcome: outcome, service_outcome_note: note || null, service_outcome_at: outcome === 'pending' ? null : new Date().toISOString() }).eq('id', job.id).select().single(), 'Saving outcome'));
  } catch (_) { return false; }
  logActivity(job.id, 'outcome', `Weekly service: ${label(OUTCOMES, outcome)}${note ? ` (${note})` : ''}`);
  if (CLOSED_OUTCOMES.includes(outcome)) await cancelOpenFollowups(job);
  else await syncFollowups(job);
  return true;
}

      <label class="check" id="fu-keep-wrap" hidden><input type="checkbox" id="fu-keep" checked> Keep the remaining follow-ups scheduled</label>
      <div class="hint" id="fu-out-hint"></div>`}`,
    foot: done ? `<button class="btn" data-close>Close</button>${f.status !== 'cancelled' ? '<button class="btn" id="fu-reopen">Reopen</button>' : ''}`

    onMount: d => {

      $('#fu-reopen') && ($('#fu-reopen').onclick = async () => {

        const v = outSel.value;

          }
          d.close(); toast(outcome === 'signed' ? 'Signed for weekly service' : 'Follow-up logged'); after && after();
        } catch (_) {}
      };
    }
  });
}

function renderJobs(view, r) {
  if (r.parts[1]) return viewJob(view, r.parts[1]);
  const st = S.jFilter || 'active', term = (S.jSearch || '').toLowerCase(), bf = S.jBuilder || '';
  const counts = Object.fromEntries(STAGE_LABELS.map(([k]) => [k, S.jobs.filter(j => j.stage === k).length]));
  const rows = S.jobs.filter(j => {
    if (st === 'active' && ['final_complete','cancelled'].includes(j.stage)) return false;
    if (!['active','all'].includes(st) && j.stage !== st) return false;
    if (bf && j.builder_id !== bf) return false;

        return `<tr class="click" data-id="${j.id}"><td><div class="name">${h(jobTitle(j))}</div><div class="clip">${h(custName(c))}</div></td>

      </div>

      <div class="jcol">
        <div class="panel panel-pad"><div class="row" style="justify-content:space-between"><h3>Quotes</h3><button class="btn btn-sm" id="j-newq">New quote</button></div>
          ${quotes.length ? `<div class="mini-list">${quotes.map(x => `<a href="#/quotes/${x.id}" class="mini"><span>v${x.version} ${statusChip(x.status)}</span><span class="num">${money(x.total)}</span></a>`).join('')}</div>`
            : '<p class="desc" style="margin:6px 0 0">No quotes yet.</p>'}</div>

        <div class="panel panel-pad"><h3>Weekly service</h3>
          <div class="g2" style="margin-top:8px"><div class="field"><label class="lbl" for="o-out">Outcome</label><select id="o-out">${opts(OUTCOMES, job.service_outcome)}</select></div>
            <div class="field"><label class="lbl" for="o-note">Note</label><input id="o-note" type="text" value="${h(job.service_outcome_note || '')}" placeholder="${job.service_outcome === 'other' ? 'Required for Other' : 'Optional'}"></div></div>
          <div class="row" style="justify-content:flex-end"><button class="btn btn-primary" id="o-save">Save outcome</button></div></div>

        <div class="panel panel-pad"><h3>Follow-ups</h3>
          ${fus.length ? `<div class="mini-list">${fus.map(f => { const late = f.status === 'open' && f.due_date < todayISO();
            return `<button class="mini" data-fu="${f.id}"><span><span class="fu-dot fu-${f.status}${late ? ' late' : ''}"></span>${h(f.label)}</span>
              <span class="${late ? 'warn-text' : 'faint'}">${f.status === 'open' ? fmtShort(f.due_date) : f.status === 'done' ? `${h(label(CHANNELS, f.channel))}${f.reached === false ? ', no reply' : ''}` : f.status === 'skipped' ? 'Skipped' : 'Closed'}</span></button>`; }).join('')}</div>`
            : `<p class="desc" style="margin:6px 0 0">${job.final_date ? (CLOSED_OUTCOMES.includes(job.service_outcome) ? 'Outcome recorded, so no follow-ups are scheduled.' : 'No follow-ups scheduled. Check Settings → Follow-up schedule.') : 'Created automatically once the final visit date is set.'}</p>`}</div>

        <div class="panel panel-pad"><h3>Activity</h3>
          <div class="row" style="align-items:flex-start;margin:8px 0 12px"><textarea id="a-note" rows="2" class="grow" placeholder="Add a note"></textarea><button class="btn" id="a-add">Add note</button></div>
          <div id="activity" class="activity"><div class="faint" style="font-size:12px">Loading…</div></div></div>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-ghost btn-danger btn-sm" id="j-del">Delete job</button></div>`;

  $('#back').onclick = () => go('jobs');
  $('#j-edit').onclick = () => editCustomer(job, c, refresh);
  $('#j-newq').onclick = () => quoteForJobDialog(job);
  $('#j-stage').onchange = async e => {
    const stage = e.target.value;
    try { Object.assign(job, await q(sb.from('su_jobs').update({ stage }).eq('id', id).select().single(), 'Updating stage'));
      logActivity(id, 'stage_change', `Stage set to ${label(STAGE_LABELS, stage)}`);
      if (stage === 'cancelled') await cancelOpenFollowups(job);
      toast('Stage updated'); refresh(); } catch (_) {}
  };

  // timeline
  const tOver = $('#t-over'), tFinal = $('#t-final'), tStart = $('#t-start'), tJoin = $('#t-join');
  const preview = () => { if (!tOver.checked) tFinal.value = computedFinal({ ...job, start_date: tStart.value || null, join_phase: tJoin.value }) || ''; };
  tOver.onchange = () => { tFinal.disabled = !tOver.checked; preview(); };
  tStart.onchange = preview; tJoin.onchange = preview;
  $('#t-save').onclick = async () => {
    const start = tStart.value || null, over = tOver.checked;
    const patch = { notice_date: $('#t-notice').value || null, start_date: start, join_phase: tJoin.value, final_date_override: over };
    patch.final_date = over ? (tFinal.value || null) : computedFinal({ ...job, ...patch });
    if (start && ['accepted','disclosure_ack'].includes(job.stage) && start <= todayISO()) patch.stage = 'in_startup';
    try {
      const before = job.final_date;
      Object.assign(job, await q(sb.from('su_jobs').update(patch).eq('id', id).select().single(), 'Saving timeline'));
      if (before !== job.final_date) logActivity(id, 'timeline', `Final visit ${job.final_date ? 'set to ' + fmtDow(job.final_date) : 'cleared'}${start ? `, start ${fmtDow(start)}` : ''}`);
      await syncFollowups(job);
      toast(job.final_date ? 'Timeline saved. Follow-ups scheduled.' : 'Timeline saved'); refresh();
    } catch (_) {}
  };
  $('#t-complete') && ($('#t-complete').onclick = async () => {
    try { Object.assign(job, await q(sb.from('su_jobs').update({ stage: 'final_complete' }).eq('id', id).select().single(), 'Updating stage'));
      logActivity(id, 'stage_change', 'Start-up complete'); toast('Start-up marked complete'); refresh(); } catch (_) {}
  });

  // disclosure
  $('#d-ack').onchange = e => { if (e.target.checked && !$('#d-date').value) $('#d-date').value = todayISO(); };
  $('#d-save').onclick = async () => {
    const ack = $('#d-ack').checked;
    const patch = { disclosure_ack: ack, disclosure_ack_date: ack ? ($('#d-date').value || todayISO()) : null, disclosure_ack_link: $('#d-link').value.trim() || null };
    if (ack && ['accepted'].includes(job.stage)) patch.stage = 'disclosure_ack';
    try { const was = job.disclosure_ack; Object.assign(job, await q(sb.from('su_jobs').update(patch).eq('id', id).select().single(), 'Saving disclosure'));
      if (was !== ack) logActivity(id, 'disclosure', ack ? 'Disclosure acknowledgment received' : 'Disclosure acknowledgment cleared');
      toast('Disclosure saved'); refresh(); } catch (_) {}
  };

  // inspection
  $('#i-save').onclick = async () => {
    const out = {};
    checklist.forEach((qq, i) => { const a = $(`[data-ia="${i}"]`).value, n = $(`[data-in="${i}"]`).value.trim(); if (a || n) out[qq] = { answer: a, note: n }; });
    const patch = { inspection: out, inspection_done_at: $('#i-done').value || null };
    const typeAns = Object.entries(out).find(([k]) => /new build or replaster/i.test(k))?.[1]?.answer;
    if (['new_build','replaster'].includes(typeAns)) patch.pool_type = typeAns;
    if (job.stage === 'request') patch.stage = 'inspection';
    try { Object.assign(job, await q(sb.from('su_jobs').update(patch).eq('id', id).select().single(), 'Saving inspection'));
      const issues = Object.entries(out).filter(([, v]) => v.answer === 'no').length;
      logActivity(id, 'inspection', `Inspection saved${patch.inspection_done_at ? ' (complete)' : ''}${issues ? `, ${issues} issue${issues > 1 ? 's' : ''} flagged` : ''}`);
      toast('Inspection saved'); refresh(); } catch (_) {}
  };

  // outcome
  $('#o-save').onclick = async () => {
    const out = $('#o-out').value, note = $('#o-note').value.trim();
    if (out === 'other' && !note) return toast('Add a note describing the outcome.', true);
    if (await setOutcome(job, out, note)) { toast('Outcome saved'); refresh(); }
  };
  $$('[data-fu]', view).forEach(bn => bn.onclick = () => followupDialog(byId(S.followups, bn.dataset.fu), refresh));

  // activity
  const drawActivity = async () => {
    let acts = [];
    try { acts = await q(sb.from('su_activity').select('*').eq('job_id', id).order('created_at', { ascending: false }).limit(60), 'Loading activity'); } catch (_) {}
    acts.sort((a, b2) => String(b2.created_at).localeCompare(String(a.created_at)));
    const el = $('#activity'); if (!el) return;
    el.innerHTML = acts.length ? acts.map(a => `<div class="act${a.kind === 'note' ? ' note' : ''}"><div>${h(a.message)}</div><div class="faint">${new Date(a.created_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</div></div>`).join('')
      : '<div class="faint" style="font-size:12px">No activity yet.</div>';
  };
  drawActivity();
  $('#a-add').onclick = async () => {
    const t = $('#a-note').value.trim(); if (!t) return;
    try { await q(sb.from('su_activity').insert({ job_id: id, kind: 'note', message: t, created_by: S.user.id }), 'Adding note'); $('#a-note').value = ''; drawActivity(); } catch (_) {}
  };
  $('#j-del').onclick = async () => {
    if (!(await confirmDialog('Delete job', `Delete this job, its ${quotes.length} quote${quotes.length === 1 ? '' : 's'}, follow-ups, and activity? The customer record stays. To keep the history, set the stage to Cancelled instead.`))) return;
    try { await q(sb.from('su_jobs').delete().eq('id', id), 'Deleting job');
      S.jobs = S.jobs.filter(j => j.id !== id); S.quotes = S.quotes.filter(x => x.job_id !== id); S.followups = S.followups.filter(f => f.job_id !== id);
      toast('Job deleted'); go('jobs'); } catch (_) {}
  };
}

function quoteForJobDialog(job) {
  const tpls = templatesFor(job.builder_id);
  openDialog({
    title: 'New quote for this job',
    body: `<div class="field"><label class="lbl" for="qj-tpl">Start from template</label><select id="qj-tpl">${tpls.map(t => `<option value="${t.id}">${h(t.name)}${t.builder_id ? '' : ' (standard)'}</option>`).join('')}<option value="">Blank quote</option></select></div>`,
    foot: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="qj-go">Create quote</button>`,
    onMount: d => $('#qj-go').onclick = async () => {
      const t = byId(S.templates, $('#qj-tpl').value);
      try { const qt = await createQuote(job, custOf(job), { lines: t ? linesFromTemplate(t.id, job.builder_id) : [], template: t });
        d.close(); toast('Quote created'); go('quotes/' + qt.id); } catch (_) {}
    }
  });
}

// ---------- today ----------
function todayCounts() {
  const t = todayISO();
  const due = S.followups.filter(f => f.status === 'open' && f.due_date <= t && byId(S.jobs, f.job_id)).length;
  return due;
}
function renderToday(view) {
  const t = todayISO(), wk = addDays(t, 7);
  const live = j => j && j.stage !== 'cancelled';
  const due = S.followups.filter(f => f.status === 'open' && f.due_date <= t && live(byId(S.jobs, f.job_id))).sort((a, b) => a.due_date.localeCompare(b.due_date));
  const upcoming = S.followups.filter(f => f.status === 'open' && f.due_date > t && f.due_date <= wk && live(byId(S.jobs, f.job_id))).sort((a, b) => a.due_date.localeCompare(b.due_date));
  const needAck = S.jobs.filter(j => live(j) && !j.disclosure_ack && (j.stage === 'accepted' || S.quotes.some(x => x.job_id === j.id && x.status === 'sent')));
  const noStart = S.jobs.filter(j => ['accepted','disclosure_ack'].includes(j.stage) && !j.start_date);
  const startingSoon = S.jobs.filter(j => live(j) && j.start_date && j.start_date >= t && j.start_date <= wk && STAGES.indexOf(j.stage) < STAGES.indexOf('in_startup'));
  const finishing = S.jobs.filter(j => live(j) && j.final_date && j.final_date >= t && j.final_date <= wk && j.stage !== 'final_complete').sort((a, b) => a.final_date.localeCompare(b.final_date));
  const staleQuotes = S.quotes.filter(x => x.status === 'sent' && x.sent_at && diffDays(t, x.sent_at.slice(0, 10)) >= 3);
  const md = S.user.user_metadata || {};
  const hello = new Date().getHours() < 12 ? 'Good morning' : new Date().getHours() < 17 ? 'Good afternoon' : 'Good evening';

  const fuRow = f => { const j = byId(S.jobs, f.job_id), c = custOf(j), late = f.due_date < t;
    return `<button class="trow" data-fu="${f.id}"><div><div class="name">${h(jobTitle(j))}</div><div class="faint" style="font-size:12px">${h(f.label)}, ${h(custName(c))}</div></div>
      <span class="${late ? 'warn-text' : 'muted'} nowrap" style="font-size:12.5px">${late ? `${-diffDays(f.due_date, t)}d overdue` : f.due_date === t ? 'Today' : fmtDow(f.due_date)}</span></button>`; };
  const jobRow = (j, right) => `<button class="trow" data-job="${j.id}"><div><div class="name">${h(jobTitle(j))}</div><div class="faint" style="font-size:12px">${h(custName(custOf(j)))}${j.builder_id ? `, ${h(byId(S.builders, j.builder_id)?.name || '')}` : ''}</div></div><span class="muted nowrap" style="font-size:12.5px">${right}</span></button>`;
  const section = (title, sub, rows, empty) => `<div class="panel"><div class="panel-pad" style="padding-bottom:8px"><h3>${title} ${rows.length ? `<span class="count">${rows.length}</span>` : ''}</h3>${sub ? `<p class="desc" style="margin:0">${sub}</p>` : ''}</div>
    <div class="tlist">${rows.length ? rows.join('') : `<div class="faint" style="padding:4px 18px 16px;font-size:13px">${empty}</div>`}</div></div>`;

  view.innerHTML = `<div class="view-head"><h2>${hello}${md.full_name ? `, ${h(md.full_name.split(' ')[0])}` : ''}</h2>
      <div class="sub">${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}. ${due.length ? `${due.length} follow-up${due.length > 1 ? 's' : ''} to do.` : 'No follow-ups due.'}</div></div>
    <div class="tgrid">
      <div>${section('Follow-ups due', 'Log each one after you call, text, or email.', due.map(fuRow), 'You’re caught up.')}
        ${upcoming.length ? section('Coming up this week', '', upcoming.map(fuRow), '') : ''}</div>
      <div>
        ${section('Waiting on disclosure', 'Quotes out or accepted without an acknowledgment on file.', needAck.map(j => jobRow(j, label(STAGE_LABELS, j.stage))), 'All acknowledgments are in.')}
        ${section('Accepted, no start date', 'Get the start date from the builder.', noStart.map(j => jobRow(j, j.notice_date ? `Notice ${fmtShort(j.notice_date)}` : '')), 'Every accepted job has a start date.')}
        ${startingSoon.length ? section('Starting this week', '', startingSoon.map(j => jobRow(j, fmtDow(j.start_date))), '') : ''}
        ${section('Final visits this week', 'Customers to line up for weekly service.', finishing.map(j => jobRow(j, fmtDow(j.final_date))), 'No final visits in the next 7 days.')}
        ${staleQuotes.length ? section('Quotes with no answer', 'Sent 3 or more days ago.', staleQuotes.map(x => { const j = jobOf(x); return j ? `<button class="trow" data-quote="${x.id}"><div><div class="name">${h(jobTitle(j))}</div><div class="faint" style="font-size:12px">${money(x.total)}</div></div><span class="muted nowrap" style="font-size:12.5px">Sent ${fmtShort(x.sent_at)}</span></button>` : ''; }), '') : ''}
      </div></div>`;
  $$('[data-fu]', view).forEach(b => b.onclick = () => followupDialog(byId(S.followups, b.dataset.fu), () => render()));
  $$('[data-job]', view).forEach(b => b.onclick = () => go('jobs/' + b.dataset.job));
  $$('[data-quote]', view).forEach(b => b.onclick = () => go('quotes/' + b.dataset.quote));
}

// =====================================================================
// BOOT
// =====================================================================
(async function boot() {
  if (!sb) {
    $('#root').innerHTML = `<div class="auth"><div class="auth-card">${brandHTML(false)}<div class="panel panel-pad"><h2>Setup needed</h2>
      <p>config.js is missing or incomplete. Add your Supabase URL and publishable key to config.js in the repo, then redeploy.</p></div></div></div>`;
    return;
  }
  const hashErr = new URLSearchParams(INITIAL_HASH.replace(/^#/, '')).get('error_description');
  let isInvite = /type=(invite|recovery|signup)/.test(INITIAL_HASH);
  window.__clearInvite = () => { isInvite = false; };
  let started = false;

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { S.user = session.user; renderAuth('setpw', 'Choose a new password for your account.'); return; }
    if (event === 'SIGNED_OUT') { isInvite = false; S.user = null; S.loaded = false; started = false; renderAuth('login'); return; }
    if (session && !started && !isInvite) { S.user = session.user; started = true; startApp(); }
    if (session) S.user = session.user;
  });

  const { data: { session } } = await sb.auth.getSession();
  if (hashErr && !session) { renderAuth('login', hashErr.replace(/\+/g, ' ') + '. Ask for a new invite or reset your password.'); return; }
  if (session && isInvite) { S.user = session.user; renderAuth('setpw', /recovery/.test(INITIAL_HASH) ? 'Choose a new password for your account.' : 'Welcome! Choose a password to finish setting up your account.'); return; }
  if (!session) { renderAuth('login'); return; }
  if (!started) { S.user = session.user; started = true; startApp(); }
})();
</script>
</body>
</html>
